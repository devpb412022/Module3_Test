<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Module 3 Study Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: hub. Header strip, three destination tiles (mock exam / extra practice / past exams), then the selected past paper below as a reveal-the-answer list. */
:root{
  --bg:#e9edf1; --surface:#ffffff; --surface-2:#f4f6f8; --ink:#13202b; --muted:#5a6773; --line:#d3dae1;
  --accent:#e6a11a; --accent-ink:#3b2900; --hl:#ffe46b; --hl-ink:#13202b; --ok:#1f8a4c; --ok-bg:#e3f4ea; --bad:#c23b2e; --bad-bg:#fbe7e4; --flag:#2f6fd0;
  --f-display:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#090d12; --surface:#121921; --surface-2:#18212b; --ink:#dde4ea; --muted:#8a97a3; --line:#25303b;
  --accent:#e9ad3a; --accent-ink:#1f1500; --hl:#4a3d0c; --hl-ink:#f3e7b3; --ok:#4cc27e; --ok-bg:#12281b; --bad:#ee6b5d; --bad-bg:#331714; --flag:#6aa3ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#090d12; --surface:#121921; --surface-2:#18212b; --ink:#dde4ea; --muted:#8a97a3; --line:#25303b;
  --accent:#e9ad3a; --accent-ink:#1f1500; --hl:#4a3d0c; --hl-ink:#f3e7b3; --ok:#4cc27e; --ok-bg:#12281b; --bad:#ee6b5d; --bad-bg:#331714; --flag:#6aa3ff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;transition:background .2s,color .2s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:clamp(1.6rem,4.5vw,2.2rem);font-weight:700}
h2{font-size:1.2rem;font-weight:600}
h3{font-size:1.1rem;font-weight:600}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.muted{color:var(--muted)}
button,a.btn{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:9px 14px;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover,a.btn:hover{border-color:var(--muted)}
button:focus-visible,a:focus-visible{outline:3px solid var(--flag);outline-offset:2px}
.primary{background:var(--accent)!important;color:var(--accent-ink)!important;border-color:var(--accent)!important;font-weight:600}
button[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--surface);min-height:40px;padding:6px 14px;font-family:var(--f-mono);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.thm{min-height:40px;padding:6px 12px}
.thm svg{width:18px;height:18px;flex:none}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.tile.sel{border:2px solid var(--accent)}
.tile .kind{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tile p{margin:0;color:var(--muted);font-size:.92rem}
.stats{display:flex;gap:16px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--f-mono);font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:.8rem;color:var(--muted)}
.tile .go{margin-top:auto}

/* past exams */
.papers{display:flex;gap:10px;flex-wrap:wrap}
.paper{text-align:left;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 16px;background:var(--surface);min-width:220px}
.paper[aria-pressed="true"]{border:2px solid var(--accent);background:var(--surface-2)}
.paper strong{font-family:var(--f-display)}
.paper small{color:var(--muted)}
.paper[disabled]{opacity:.6}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=search]{font:inherit;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:44px;flex:1;min-width:180px}
.prog{height:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:3px;overflow:hidden;flex:1;min-width:100px}
.prog i{display:block;height:100%;background:var(--ok)}
.count{font-family:var(--f-mono);font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.qlist{display:flex;flex-direction:column;gap:10px}
.qi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.qi.known{border-color:var(--ok)}
.qi .top{display:flex;gap:12px;align-items:baseline}
.qi .n{font-family:var(--f-mono);font-weight:600;color:var(--muted);min-width:2ch;font-variant-numeric:tabular-nums}
.qi .q{font-style:italic;font-weight:500;min-width:0}
.ans{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.key{background:var(--ok-bg);border:1px solid var(--ok);border-radius:6px;padding:6px 10px;min-width:0;flex:1 1 240px}
.key small{display:block;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ok)}
.cover{border:1px dashed var(--muted);border-radius:6px;padding:6px 10px;color:var(--muted);flex:1 1 240px;cursor:pointer;background:var(--surface-2);text-align:left;min-height:44px}
.tag{font-family:var(--f-mono);font-size:.72rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.fig{border-color:var(--flag);color:var(--flag)}
.warnbox{border:1px solid var(--bad);background:var(--bad-bg);border-radius:6px;padding:8px 12px;font-size:.9rem}
.note{font-size:.88rem;color:var(--muted)}
.mini{min-height:36px;padding:4px 12px;font-size:.88rem}
.mini[aria-pressed="true"]{border-color:var(--ok);color:var(--ok);font-weight:600}
@media (max-width:520px){.card{padding:16px}.paper{min-width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.figbox{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;justify-content:center;margin:8px 0}.figbox img{max-width:100%;max-height:260px;height:auto}
</style>
</head>

  guide:'เฉลยและคำอธิบาย',guideD:'อ่านเฉลย สูตร และ trick ของทุกข้อได้เลย ไม่ต้องทำข้อสอบ ค้นหาได้',
  mock:'ข้อสอบจำลอง',mockD:'จับเวลาแบบสอบจริง เกณฑ์ผ่าน 75% เฉลยพร้อม trick ทุกข้อ',
  prac:'แบบฝึกหัดเพิ่มเติม',pracD:'เลือกหัวข้อ ฝึกทีละข้อ สลับไทย/อังกฤษและโหมดกลางคืน',
  past:'ข้อสอบเก่า',pastD:'เปิดดูโจทย์และคีย์ของข้อสอบเก่า ซ่อนคำตอบเพื่อทดสอบตัวเองได้',
  qs:'ข้อ',min:'นาที',pass:'เกณฑ์ผ่าน',papers:'ชุด',open:'เปิดหน้านี้',view:'ดูข้อสอบเก่า',topics:'หัวข้อ',
  choose:'เลือกชุดข้อสอบเก่า',search:'ค้นหาในโจทย์หรือคำตอบ',hide:'ซ่อนคำตอบทั้งหมด',show:'แสดงคำตอบทั้งหมด',reveal:'แตะเพื่อดูคำตอบ',
  key:'คำตอบ',known:'จำได้แล้ว',mark:'ทำเครื่องหมายว่าจำได้',onlyNew:'เฉพาะที่ยังจำไม่ได้',fig:'มีรูปประกอบ',none:'ไม่พบข้อที่ตรงกับคำค้น',
  ptc:'คีย์ในไฟล์นี้ขัดกับตำรา Module 3 ซึ่งระบุว่า PTC อุณหภูมิขึ้นแล้วความต้านทานเพิ่มขึ้น ควรตอบตามตำรา',
  night:'โหมดกลางคืน',light:'สว่าง',auto:'อัตโนมัติ',known2:'จำได้',total:'ข้อสอบเก่ารวม',note:'ข้อที่มีรูปประกอบ แสดงรูปใต้โจทย์ให้แล้ว'},
 en:{title:'Module 3 Study Hub',sub:'EASA Part-66 CAT B1 / B2',
  guide:'Answers & Explanations',guideD:'Read every key, formula and memory trick straight through, no quiz needed. Searchable',
  mock:'Mock Exam',mockD:'Timed like the real exam, 75% pass mark, key with memory tricks for every question',
  prac:'Extra Practice',pracD:'Pick topics, drill one by one, switch Thai/English and night mode',
  past:'Past Exams',pastD:'Browse questions and keys from past papers. Hide the answers to test yourself',
  qs:'Qs',min:'min',pass:'Pass mark',papers:'papers',open:'Open',view:'Browse past exams',topics:'topics',
  choose:'Choose a past paper',search:'Search questions or answers',hide:'Hide all answers',show:'Show all answers',reveal:'Tap to reveal answer',
  key:'Answer',known:'Known',mark:'Mark as known',onlyNew:'Not known yet',fig:'Has figure',none:'No question matches your search',
  ptc:'The key in this file conflicts with the Module 3 text, which says a PTC\'s resistance rises with temperature. Use the textbook answer.',
  night:'Night mode',light:'Light',auto:'Auto',known2:'known',total:'Past-exam questions',note:'Questions with a figure show it under the question text.'}
};
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const S={lang:store.get('m3p_lang','th'),theme:store.get('m3p_theme','auto'),paper:null,q:'',hideAll:true,open:new Set(),onlyNew:false,known:store.get('m3h_known',{})};
const $=s=>document.querySelector(s),app=$('#app');
const tr=k=>T[S.lang][k];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function applyTheme(){const r=document.documentElement;if(S.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme==='night'?'dark':'light')}
const ICON={auto:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>',
 light:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
 night:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 13.5A9 9 0 1 1 10.5 3a7 7 0 0 0 10.5 10.5z"/></svg>'};
const kn=(p,i)=>!!S.known[p+i];
function render(){
  document.documentElement.lang=S.lang;
  const lab=S.theme==='night'?tr('night'):S.theme==='light'?tr('light'):tr('auto');
  const total=PAPERS.reduce((a,p)=>a+p.data.length,0);
  const kcount=Object.values(S.known).filter(Boolean).length;
  app.innerHTML=`
  <header class="row spread"><div><div class="eyebrow">${esc(tr('sub'))}</div><h1>${esc(tr('title'))}</h1></div>
   <div class="tools"><div class="seg" role="group" aria-label="Language"><button id="lt" aria-pressed="${S.lang==='th'}">TH</button><button id="le" aria-pressed="${S.lang==='en'}">EN</button></div>
   <button class="thm" id="th" aria-label="Theme">${ICON[S.theme]}<span>${esc(lab)}</span></button></div></header>
  <section class="tiles">
   <div class="tile"><span class="kind">01</span><h3>${esc(tr('mock'))}</h3><p>${esc(tr('mockD'))}</p>
     <div class="stats"><div class="stat"><b>45</b><span>${esc(tr('qs'))}</span></div><div class="stat"><b>56:15</b><span>${esc(tr('min'))}</span></div><div class="stat"><b>75%</b><span>${esc(tr('pass'))}</span></div></div>
     <a class="btn primary go" href="${LINKS.mock}" >${esc(tr('open'))} →</a></div>
   <div class="tile"><span class="kind">02</span><h3>${esc(tr('prac'))}</h3><p>${esc(tr('pracD'))}</p>
     <div class="stats"><div class="stat"><b>61</b><span>${esc(tr('qs'))}</span></div><div class="stat"><b>10</b><span>${esc(tr('topics'))}</span></div><div class="stat"><b>TH/EN</b><span>&nbsp;</span></div></div>
     <a class="btn primary go" href="${LINKS.practice}" >${esc(tr('open'))} →</a></div>
   <div class="tile ${S.paper?'sel':''}"><span class="kind">03</span><h3>${esc(tr('past'))}</h3><p>${esc(tr('pastD'))}</p>
     <div class="stats"><div class="stat"><b>${total}</b><span>${esc(tr('qs'))}</span></div><div class="stat"><b>${PAPERS.filter(p=>p.ok).length}</b><span>${esc(tr('papers'))}</span></div><div class="stat"><b>${kcount}</b><span>${esc(tr('known2'))}</span></div></div>
     <button class="primary go" id="pastbtn">${esc(tr('view'))} ↓</button></div>
   <div class="tile"><span class="kind">04</span><h3>${esc(tr('guide'))}</h3><p>${esc(tr('guideD'))}</p>
     <div class="stats"><div class="stat"><b>106</b><span>${esc(tr('qs'))}</span></div><div class="stat"><b>TH/EN</b><span>&nbsp;</span></div></div>
     <a class="btn primary go" href="${LINKS.guide}" >${esc(tr('open'))} →</a></div>
  </section>
  <section id="past" class="card" style="display:${S.paper?'flex':'none'};flex-direction:column;gap:14px">${S.paper?'':''}</section>`;
  $('#lt').onclick=()=>{S.lang='th';store.set('m3p_lang','th');render()};$('#le').onclick=()=>{S.lang='en';store.set('m3p_lang','en');render()};
  $('#th').onclick=()=>{S.theme={auto:'night',night:'light',light:'auto'}[S.theme];store.set('m3p_theme',S.theme);applyTheme();render()};
  $('#pastbtn').onclick=()=>{if(!S.paper)S.paper='a';render();$('#past').scrollIntoView({behavior:'smooth',block:'start'})};
  if(S.paper)renderPast();
}
function renderPast(){
  const P=PAPERS.find(p=>p.id===S.paper),el=$('#past');
  const rows=P.data.map((d,i)=>({d,i})).filter(({d,i})=>{
    if(S.onlyNew&&kn(P.id,i))return false;
    if(!S.q)return true;const s=S.q.toLowerCase();return (d.q+' '+d.a).toLowerCase().includes(s)});
  const kc=P.data.filter((d,i)=>kn(P.id,i)).length;
  el.innerHTML=`
  <div><h2>${esc(tr('choose'))}</h2></div>
  <div class="papers">${PAPERS.map(p=>`<button class="paper" data-p="${p.id}" aria-pressed="${p.id===S.paper}" ${p.ok?'':'disabled'}><strong>${esc(p[S.lang])}</strong><small>${p.ok?p.data.length:p.n} ${esc(tr('qs'))} · ${esc(S.lang==='th'?p.dth:p.den)}</small></button>`).join('')}</div>
  <div class="bar"><input type="search" id="sq" placeholder="${esc(tr('search'))}" value="${esc(S.q)}" aria-label="${esc(tr('search'))}">
   <button id="ha">${esc(S.hideAll?tr('show'):tr('hide'))}</button>
   <button id="on" class="mini" aria-pressed="${S.onlyNew}">${esc(tr('onlyNew'))}</button></div>
  <div class="bar"><div class="prog"><i style="width:${kc/P.data.length*100}%"></i></div><span class="count">${kc}/${P.data.length} ${esc(tr('known2'))}</span></div>
  <p class="note" style="margin:0">${esc(tr('note'))}</p>
  <div class="qlist">${rows.length?rows.map(({d,i})=>{
    const shown=!S.hideAll||S.open.has(P.id+i),k=kn(P.id,i);
    return `<div class="qi ${k?'known':''}"><div class="top"><span class="n">${i+1}</span><span class="q">${esc(d.q)}</span></div>
     <div class="row" style="gap:6px">${d.fig?`<span class="tag fig">${esc(tr('fig'))}</span>`:''}</div>
     ${d.fig?`<div class="figbox"><img src="${FIG[d.fig]}" alt="figure"></div>`:''}
     <div class="ans">${shown?`<div class="key"><small>${esc(tr('key'))}</small>${esc(d.a)}</div>`:`<button class="cover" data-r="${i}">${esc(tr('reveal'))}</button>`}
     <button class="mini" data-k="${i}" aria-pressed="${k}">${esc(k?tr('known'):tr('mark'))}</button></div>
     ${shown&&d.note==='ptc'?`<div class="warnbox">${esc(tr('ptc'))}</div>`:''}</div>`}).join(''):`<div class="muted">${esc(tr('none'))}</div>`}</div>`;
  el.querySelectorAll('.paper').forEach(b=>b.onclick=()=>{S.paper=b.dataset.p;S.q='';S.open=new Set();render()});
  const sq=$('#sq');sq.oninput=e=>{S.q=e.target.value;const pos=e.target.selectionStart;renderPast();const n=$('#sq');n.focus();n.setSelectionRange(pos,pos)};
  $('#ha').onclick=()=>{S.hideAll=!S.hideAll;S.open=new Set();renderPast()};
  $('#on').onclick=()=>{S.onlyNew=!S.onlyNew;renderPast()};
  el.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{S.open.add(P.id+b.dataset.r);renderPast()});
  el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const key=P.id+b.dataset.k;S.known[key]=!S.known[key];store.set('m3h_known',S.known);render()});
}
applyTheme();render();
</script>

</body>
</html>
