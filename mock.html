<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Module 3 Mock Exam</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one exam console column — sticky status strip (timer / progress) over a question card, navigator grid below. */
:root{
  --bg:#e9edf1; --surface:#ffffff; --surface-2:#f4f6f8; --ink:#13202b; --muted:#5a6773; --line:#d3dae1;
  --accent:#e6a11a; --accent-ink:#3b2900; --hl:#ffe46b; --ok:#1f8a4c; --ok-bg:#e3f4ea; --bad:#c23b2e; --bad-bg:#fbe7e4; --flag:#2f6fd0;
  --f-display:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#161f28; --surface-2:#1c2732; --ink:#e4eaef; --muted:#93a1ad; --line:#2b3946;
  --accent:#f0b23b; --accent-ink:#241800; --hl:#6b5512; --ok:#4cc27e; --ok-bg:#15301f; --bad:#ee6b5d; --bad-bg:#3a1a17; --flag:#6aa3ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#161f28; --surface-2:#1c2732; --ink:#e4eaef; --muted:#93a1ad; --line:#2b3946;
  --accent:#f0b23b; --accent-ink:#241800; --hl:#6b5512; --ok:#4cc27e; --ok-bg:#15301f; --bad:#ee6b5d; --bad-bg:#3a1a17; --flag:#6aa3ff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:clamp(1.7rem,4.5vw,2.4rem);font-weight:700}
h2{font-size:1.3rem;font-weight:600}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.muted{color:var(--muted)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:10px 16px;min-height:44px}
button:hover{border-color:var(--muted)}
button:focus-visible,.opt:focus-visible{outline:3px solid var(--flag);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.primary:hover{filter:brightness(1.05)}
button[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}

/* start */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0 4px}
.rule{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.rule b{display:block;font-family:var(--f-mono);font-size:1.25rem;font-variant-numeric:tabular-nums}
.rule span{font-size:.85rem;color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.mode{text-align:left;padding:16px;display:flex;flex-direction:column;gap:4px;background:var(--surface);min-height:0}
.mode[aria-pressed="true"]{border:2px solid var(--accent);background:var(--surface-2)}
.mode strong{font-family:var(--f-display);font-size:1.1rem}
.mode small{color:var(--muted);font-size:.88rem;line-height:1.5}
label.chk{display:flex;gap:8px;align-items:center;font-size:.95rem}
.hist{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}

/* status bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.timer{font-family:var(--f-mono);font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.timer.warn{color:var(--bad)}
.prog{flex:1;min-width:120px;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.count{font-family:var(--f-mono);font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* question */
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.qnum{font-family:var(--f-mono);font-weight:600}
.tag{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.pdf{border-color:var(--flag);color:var(--flag)}
.tag.ok{border-color:var(--ok);color:var(--ok)}
.qtext{font-size:1.12rem;font-weight:500;margin:10px 0 14px;font-style:italic}
.diagram{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:14px;overflow-x:auto;color:var(--ink);display:flex;justify-content:center}
.diagram svg{max-width:100%;height:auto;display:block}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;background:var(--surface);width:100%}
.opt .k{font-family:var(--f-mono);font-weight:600;min-width:1.6em;height:1.6em;border-radius:50%;border:1.5px solid var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;flex:none;margin-top:2px}
.opt.sel{border:2px solid var(--accent);background:var(--surface-2)}
.opt.sel .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border:2px solid var(--ok);background:var(--ok-bg)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border:2px solid var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt[disabled]{opacity:1;cursor:default}
.opt span.t{min-width:0}
.flagbtn[aria-pressed="true"]{border-color:var(--flag);color:var(--flag);font-weight:600}

/* explanation */
.exp{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.verdict{font-family:var(--f-display);font-weight:600;font-size:1.05rem}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.exp p{margin:0}
.trick{background:var(--hl);color:var(--ink);border-radius:6px;padding:10px 12px}
.trick b{font-family:var(--f-display)}
.ref{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.formula{font-family:var(--f-mono);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;overflow-x:auto;white-space:pre;font-size:.9rem}

/* navigator */
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.nav button{padding:0;min-height:40px;font-family:var(--f-mono);font-size:.9rem;font-variant-numeric:tabular-nums;position:relative}
.nav button.ans{background:var(--surface);border-color:var(--muted);font-weight:600}
.nav button.cur{outline:2px solid var(--accent);outline-offset:1px}
.nav button.flg::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--flag)}
.nav button.r{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.nav button.w{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}

/* result */
.score{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.big{font-family:var(--f-mono);font-size:clamp(2.6rem,9vw,3.6rem);font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.stamp{font-family:var(--f-display);font-weight:700;font-size:1.3rem;padding:6px 14px;border-radius:6px;border:3px solid currentColor;transform:rotate(-4deg);letter-spacing:.08em}
.stamp.pass{color:var(--ok)} .stamp.fail{color:var(--bad)}
.topics{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 120px 48px;gap:10px;align-items:center;font-size:.9rem}
.tbar{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--ok)}
.trow .n{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.review{display:flex;flex-direction:column;gap:14px}
.modal{position:fixed;inset:0;background:rgb(0 0 0 / .45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal .card{max-width:420px;width:100%}
@media (max-width:520px){.timer{font-size:1.25rem}.card{padding:16px}.trow{grid-template-columns:minmax(0,1fr) 70px 44px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.diagram img{background:#fff;border-radius:6px;max-width:100%;height:auto;display:block}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--muted);padding:5px 12px;font-family:var(--f-mono);font-size:.8rem;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.thm{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:5px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:.8rem}
.thm svg{width:16px;height:16px}
</style>
</head>

{t:'3.16 Filters',src:'hl',q:'In a RCL series circuit the output is connected to the resistor. What type of filter is it?',o:['Low-pass filter','High-pass filter','Band-pass filter'],a:2,

{t:'3.11 Induction',src:'hl',q:'With the help of the right-hand rule (generator) symbolize the fingertips?',o:['The direction of the current.','The direction of the magnet lines.','The direction of movement.'],a:0,

{t:'3.13 AC / 3-phase',src:'hl',q:'What is an advantage of a star connected generator if compared with a delta connected generator?',o:['Two different output voltages are available.','A balanced load is guaranteed.','The line and phase voltage are equal.'],a:0,
 e:'Star มีจุดร่วม (star point/neutral) จึงได้ 2 แรงดัน: Phase voltage (สายเฟส–นิวทรัล) และ Line voltage (เฟส–เฟส) = √3 × V phase เช่นระบบเครื่องบิน 115 V / 200 V. ส่วน "line = phase voltage" เป็นคุณสมบัติของ Delta',
 f:'Star:  V_line = √3 · V_phase   I_line = I_phase\nDelta: V_line = V_phase        I_line = √3 · I_phase',

{t:'3.17 AC Generators',src:'hl',q:'What is the advantage of the brushless generator?',o:['Easy to regulate.','Lower maintenance cost.','Lower control effort.'],a:1,

{t:'3.18 AC Motors',src:'hl',q:'Which device is necessary to start a single-phase asynchronous motor?',o:['Starting coil','Starting capacitor','Starting resistor'],a:1,

{t:'3.18 AC Motors',src:'hl',q:'The induction motor is also called?',o:['Asynchronous motor','Synchronous motor','Universal motor'],a:0,

{t:'3.3 Current theory',src:'hl',q:'What is the direction of current flow in the "conventional theory" (technical direction)?',o:['From the plus pole of the consumer to plus pole consumer (internal current).','From the plus pole of the voltage source to the minus pole of the voltage source.','From the minus pole of the voltage source to the plus pole of the voltage source.'],a:1,

{t:'3.3 Current theory',src:'hl',q:'What is the direction of current flow in the "electron theory" (physical direction)?',o:['From the minus pole of the voltage source to the plus pole of the voltage source.','From the plus pole of the voltage source to the minus pole of the voltage source.','From the plus pole of the consumer to plus pole consumer (internal current).'],a:0,

 k:'Electron = ลบ → ลบผลักลบ ออกจาก "–" วิ่งไปหา "+" (ขั้วต่างดูดกัน)',ref:'PDF 3.3 Conventional / Electron Theory'},
{t:'3.2–3.3 Charge & Current',src:'hl',q:'What is the correct formula to calculate the electrical charge?',o:['Q = I / t','Q = I · t','Q = t / I'],a:1,

 f:'Q = I · t   (1 Ah = 3600 C)',
 k:'จำสามเหลี่ยม Q อยู่บน, I กับ t อยู่ล่าง → ปิด Q เหลือ I × t • ปิด I เหลือ Q ÷ t',ref:'PDF 3.2.2 Coulomb (ampere-hour)'},
{t:'3.2–3.3 Charge & Current',src:'hl',q:'What is a current of 1 Ampere?',o:['An electromotive force (EMF) of 1 volt produced by a charge of 1 Coulomb.','An electron flow of 1 Coulomb in a time of 1 minute.','A charge of 1 Coulomb is passing a point in a circuit in 1 second.'],a:2,
 e:'1 Ampere = ประจุ 1 Coulomb (6.28 × 10¹⁸ อิเล็กตรอน) ผ่านจุดหนึ่งในวงจรภายใน 1 วินาที',
 k:'ระวังกับดัก "1 minute" — หน่วย SI ใช้ "วินาที" เสมอ • 1 C ≈ 6.28 × 10¹⁸ e⁻ (จำ "6.28 = 2π")',ref:'PDF 3.2.2 Coulomb'},
{t:'3.4–3.5 EMF sources',src:'hl',q:'Which voltage source produce an electromotive force (EMF) by a chemical action?',o:['Battery','Piezo','Thermocouple'],a:0,

 k:'6 แหล่ง EMF: Friction–Chemical–Heat–Light–Pressure–Magnetism จับคู่: เคมี=แบตฯ, ร้อน=Thermo, กด=Piezo, แสง=Solar cell, แม่เหล็ก=Generator',ref:'PDF 3.4 / 3.5 Generation of Electricity'},
{t:'3.7 Resistance',src:'hl',q:'What types of variable resistors are used?',o:['Potentiometers and rheostats','Deposited Film resistors','Spring Resistors and rheostats'],a:0,
 e:'ตัวต้านทานปรับค่าได้มี 2 แบบ: Potentiometer ใช้ 3 ขั้ว (เป็นตัวแบ่งแรงดัน) และ Rheostat ใช้ 2 ขั้ว (ควบคุมกระแส). Deposited film เป็นตัวต้านทานค่าคงที่',
 k:'Pot = 3 ขา (แบ่ง Voltage) • Rheo = 2 ขา (คุม current) — "Spring resistor" ไม่มีจริง เป็นตัวหลอก',ref:'PDF 3.7.1.2 Potentiometer / Rheostat'},
{t:'3.6 DC Circuits',src:'hl',q:'Which statement about the total resistance of a series connection of resistors is true?',o:['The voltage drops at each resistor in the series circuit are the same.','The current is the same at each position in the circuit.','The total current of the series connection is the sum of all currents.'],a:1,

 k:'Series = Same Current (S-S) • Parallel = Same Voltage (P-V)',ref:'PDF 3.6 DC Circuits'},
{t:'3.6 DC Circuits',src:'hl',d:'network',q:'What is the total resistance of the circuit in the picture, if the resistance value of each resistor (R1 to R5) is 5100 ohm?',o:['2550 ohm','5100 ohm','10200 ohm'],a:2,
 e:'กิ่งซ้าย R2+R4 = 10200 Ω, กิ่งขวา R3+R5 = 10200 Ω → 2 กิ่งเท่ากันขนานกัน = 10200/2 = 5100 Ω แล้วบวก R1 ที่อนุกรม = 5100 + 5100 = 10200 Ω',
 f:'R_branch = 5100 + 5100 = 10200\nR_par    = 10200 / 2 = 5100\nR_total  = R1 + R_par = 10200 Ω',
 k:'R เท่ากัน n ตัวขนานกัน = R ÷ n — สองกิ่งเท่ากัน "หาร 2" ทันที ไม่ต้องใช้สูตร product/sum',ref:'PDF 3.6 Series/Parallel'},
{t:'3.7 Wheatstone bridge',src:'hl',d:'bridge',q:'What is the value of Rx in the shown circuit, if the Wheatstone bridge is in balance?',o:['15.9 ohm','1000 ohm','1590 ohm'],a:0,
 e:'สมดุลเมื่อ C และ B มีศักย์เท่ากัน (มิเตอร์ = 0): อัตราส่วนแขนบน = อัตราส่วนแขนล่าง → 100/Rx = 1000/159 → Rx = 100 × 159 / 1000 = 15.9 Ω',
 f:'R_AC / R_CD = R_AB / R_BD\n100 / Rx = 1000 / 159\nRx = 100 × 159 / 1000 = 15.9 Ω',
 k:'"ซ้ายบน/ขวาบน = ซ้ายล่าง/ขวาล่าง" • ด้านล่างขวา (159) เล็กกว่าซ้าย (1000) ราว 6 เท่า → Rx ต้องเล็กกว่า 100 ราว 6 เท่า ≈ 16 Ω',ref:'PDF 3.7.6 Wheatstone Bridge'},
{t:'3.7 Wheatstone bridge',src:'hl',q:'What is the output voltage of the Wheatstone bridge if the bridge is in balance?',o:['V_out = V_in','V_out = 0 V','V_out = 0.5 · V_in'],a:1,
 e:'ที่สมดุล ทั้งสองตัวแบ่งแรงดันให้ศักย์ที่จุดกลางเท่ากัน ความต่างศักย์ระหว่างจุดเอาต์พุต (C–B) = 0 V มิเตอร์ชี้ศูนย์ (null)',
 k:'Balance = "Null" = 0 V = 0 กระแสผ่านมิเตอร์',ref:'PDF 3.7.6 Wheatstone Bridge'},
{t:'3.9 Capacitance',src:'old',q:'What is the charge in a capacitor after 1 tau charge time?',o:['37 %','63 %','100 %'],a:1,
 e:'เฉลยตรงกับไฟล์ข้อสอบเก่า (63 %) และ PDF: ที่ 1τ = R·C แรงดันคร่อมเพลต = 63.2 % ของแรงดันที่จ่าย, กระแสเหลือ 36.8 % และจะชาร์จเต็ม (~100 %) ที่ 5τ',
 f:'τ = R · C (วินาที)\n1τ → 63.2 %   2τ → 86.5 %   3τ → 95 %   5τ → ~100 %',
 k:'"63 ขึ้น 37 ลง" — ชาร์จ: แรงดันขึ้นถึง 63 % • ดิสชาร์จหรือกระแส: เหลือ 37 % • 5τ = เต็ม/หมด (เลข 5 คือ "จบ")',ref:'PDF 3.9.3 Time Constant'},
{t:'3.8 Power',src:'old',d:'bulbs',q:'What is the total power of the circuit in the picture if each bulb (E1 to E10) have the following values 3V/5W?',o:['5 W','30 W','50 W'],a:2,
 e:'เฉลยตรงกับไฟล์ข้อสอบเก่า (50 Watt) และหลักใน PDF: กำลังรวมของโหลดทุกตัว "บวกกัน" เสมอ ไม่ว่าต่ออนุกรมหรือขนาน → 10 × 5 W = 50 W (แหล่งจ่ายต้องเป็น 10 × 3 V = 30 V)',
 f:'P_total = P1 + P2 + … + P10 = 10 × 5 W = 50 W\nU = 10 × 3 V = 30 V,  I = P/U = 50/30 ≈ 1.67 A',
 k:'กำลังบวกกันตรง ๆ เสมอ (series หรือ parallel ก็ตาม) — 30 W คือตัวหลอกที่เอา 30 V มาตอบ',ref:'PDF 3.8 Power'},
{t:'3.8 Power',src:'hl',q:'What is the unit of the electrical work?',o:['Watt Seconds (Ws)','Watts (W)','Volt Ampere (VA)'],a:0,
 e:'งาน/พลังงาน = กำลัง × เวลา (W = P·t) หน่วยคือ Ws (= Joule) หรือ Wh, kWh. Watt คือกำลัง ส่วน VA คือกำลังปรากฏ (apparent power) ใน AC',
 f:'W = P · t   →   1 Ws = 1 J,  1 kWh = 3.6 MJ',
 k:'"งาน = ต้องมีเวลา" ตัวเลือกไหนไม่มี "s/h" ในหน่วย = กำลัง ไม่ใช่งาน',ref:'PDF 3.8.2 Electrical energy / Electrical work'},
{t:'3.8 Power',src:'hl',q:'What is the efficiency-factor of a circuit in power matching?',o:['less than 50 %','more than 50 %','Exactly 50 %'],a:2,
 e:'Power matching (Maximum power transfer) เกิดเมื่อ R_load = R_internal กระแสเดียวกันไหลผ่านทั้งสอง กำลังจึงแบ่งครึ่ง: ครึ่งหนึ่งไปโหลด อีกครึ่งเสียในแหล่งจ่าย → ประสิทธิภาพ η = 50 %',
 f:'R_L = R_i  →  P_load = P_loss  →  η = 50 %',
 k:'Matching = "เท่ากัน" → R เท่ากัน → แบ่งกำลังเท่ากัน → ครึ่ง ๆ 50/50',ref:'PDF 3.8 Maximum power transfer (power matching)'},
{t:'3.9 Capacitance',src:'hl',q:'Two capacitors, one with 2 µF and one with 4 µF capacity are connected in series. What is the total capacity?',o:['more than 2 µF','more than 4 µF','less than 2 µF'],a:2,
 e:'ตัวเก็บประจุอนุกรมใช้สูตรเหมือนตัวต้านทานขนาน: C = (2 × 4)/(2 + 4) = 1.33 µF ซึ่งน้อยกว่าตัวที่เล็กที่สุดเสมอ',
 f:'1/C = 1/C1 + 1/C2   →   C = 2·4 / (2+4) = 1.33 µF',
 k:'C "กลับหัว" จาก R: C อนุกรม = เล็กกว่าตัวเล็กสุด • C ขนาน = บวกกันตรง ๆ (เหมือน R อนุกรม)',ref:'PDF 3.9 Capacitors in series/parallel'},
{t:'3.9 Capacitance',src:'hl',q:'Which answer is correct to increase the capacitance of a capacitor?',o:['Increase the distance between the plates.','Increase the area of the plates.','Decrease the area of the plates?'],a:1,
 e:'C = ε · A / d ความจุแปรผันตรงกับพื้นที่เพลต (A) และ dielectric constant (ε) แต่แปรผกผันกับระยะห่าง (d) → เพิ่มพื้นที่ = C เพิ่ม',
 f:'C = ε₀ · εr · A / d',
 k:'"กว้างขึ้น ใกล้ขึ้น = จุมากขึ้น" — เพลตใหญ่ เก็บประจุได้มาก; ห่างกันมาก แรงดึงดูดน้อย จุน้อย',ref:'PDF 3.9 Capacitance / Dielectric'},
{t:'3.9 Capacitance',src:'hl',q:'What is the dielectric constant Epsilon (relative permeability) of air?',o:['0','0.5','1'],a:2,
 e:'Dielectric constant (εr) เป็นตัวคูณเทียบกับสุญญากาศ (vacuum = 1) อากาศมีค่า ≈ 1.0006 ≈ 1 ไม่มีวัสดุใดต่ำกว่า 1 ดังนั้น 0 และ 0.5 เป็นไปไม่ได้',
 k:'εr คือ "ตัวคูณ" เทียบสุญญากาศ ต่ำสุดคือ 1 เสมอ — อากาศ ≈ สุญญากาศ = 1 • (ในข้อสอบใช้คำว่า permeability แต่จริง ๆ คือ permittivity)',ref:'PDF 3.9 Dielectric constant (Ԑr)'},
{t:'3.10 Relay',src:'hl',q:'Which statement about a "normally open" contact of a relay is true?',o:['The contact will be closed if the armature of a relay is attracted by a magnetic field.','The contact will be opened if the armature of a relay is attracted by a magnetic field.','The contact will be closed if the armature of a relay is rejected by a magnetic field.'],a:0,
 e:'Normally open (NO) คือสภาพปกติ "เปิด" (ไม่มีกระแสในคอยล์) เมื่อคอยล์ได้รับกระแส เกิดสนามแม่เหล็กดูดอาร์เมเจอร์ (armature) ให้เคลื่อนที่ คอนแทคจึงปิด (closed) และเมื่อตัดกระแส สปริงดึงอาร์เมเจอร์กลับ คอนแทคเปิดตามเดิม',
 k:'NO = "ไม่จ่ายไฟ = เปิด" • จ่ายไฟคอยล์ = ดูด = สถานะสลับ (NO → ปิด, NC → เปิด) • ตัวเลือกที่ใช้คำว่า "rejected" ไม่มีจริง เป็นตัวหลอก',ref:'PDF 3.10 Relay (electromagnet application)'},
{t:'3.11 Inductor',src:'hl',q:'What is the current flow in a coil after a charge time of 1 tau?',o:['37 %','63 %','100 %'],a:1,
 e:'ในวงจร RL เมื่อต่อแหล่งจ่าย กระแสค่อย ๆ เพิ่มขึ้น (คอยล์ต้านการเปลี่ยนแปลง) ที่ 1τ = L/R กระแสถึง 63.2% ของค่าสุดท้าย และถึงค่าเกือบสุด (~100%) ที่ 5τ',
 f:'τ = L / R\n1τ → I = 63.2 %   5τ → ~100 %',
 k:'"63 ขึ้น" — สิ่งที่ "เพิ่มขึ้น" ถึง 63% ที่ 1τ (กระแสในคอยล์, แรงดันคร่อมตัวเก็บประจุ) • สิ่งที่ "ลดลง" เหลือ 37%',ref:'PDF 3.11.1.5 Time Constant'},
{t:'3.11 Inductor',src:'hl',q:'What is a way to reduce the eddy-current in iron core of a coil?',o:['Use a galvanize iron core.','Use a solid iron core.','Use a laminated iron core.'],a:2,
 e:'กระแสไหลวน (eddy current) เกิดจากการเหนี่ยวนำในแกนเหล็ก ทำให้ร้อนและเสียพลังงาน แก้โดยทำแกนเป็นแผ่นบางซ้อนกัน (laminated) คั่นด้วยฉนวน เพื่อตัดวงจรกระแสไหลวนให้เล็กลง ส่วนแกนตัน (solid) ยิ่งเสียมาก',
 k:'Laminated = "ชั้นบาง ๆ" ตัดทางวิ่งของกระแสวน (เหมือนเขื่อนกั้นน้ำวนเป็นช่อง ๆ) • แกนหม้อแปลง, pole piece ของ generator ล้วน laminated',ref:'PDF 3.11.2.3 Inductor Losses / 3.12.2.2 Field Magnet System'},
{t:'3.11 Inductor',src:'hl',q:'What is the voltage you can measure at the coil after a charge time of 1 tau?',o:['63 %','37 %','100 %'],a:1,
 e:'ที่ 1τ แรงดันตกคร่อมตัวต้านทาน R = 63.2% ของแรงดันจ่าย ดังนั้นแรงดันที่คร่อมคอยล์ = 100 − 63.2 = 36.8% ≈ 37% (ตอนแรกคอยล์รับแรงดันเต็ม แล้วค่อย ๆ ลดลงเมื่อกระแสนิ่ง)',
 f:'V_coil = V_supply − V_R = 100 % − 63.2 % = 36.8 %',
 k:'ใน RL: กระแส & V_R "ขึ้น 63" • V_L "ลง 37" (รวมกันต้องได้ 100) — ต่างจากตัวเก็บประจุที่ V_C ขึ้น 63',ref:'PDF 3.11.1.5 Time Constant'},
{t:'3.11 Inductor',src:'hl',q:'Which statement about a series connection of inductances is true?',o:['The total inductance is always lower than the highest inductance in the circuit.','The total inductance is always lower than the smallest inductance in the circuit.','The total inductance is the sum of all the inductances in the circuit.'],a:2,
 e:'ตัวเหนี่ยวนำอนุกรมรวมกันแบบตรง ๆ (เหมือนตัวต้านทานอนุกรม) L_total = L1 + L2 + … ส่วนแบบขนานจะน้อยกว่าตัวที่เล็กที่สุด',
 f:'Series:   L_T = L1 + L2 + L3\nParallel: 1/L_T = 1/L1 + 1/L2 + 1/L3',
 k:'L ทำตัวเหมือน R: อนุกรม = บวก • ขนาน = ส่วนกลับ • ส่วน C กลับด้านกับ R/L (C อนุกรม = ส่วนกลับ, C ขนาน = บวก)',ref:'PDF 3.11 Inductance (series / parallel)'},
{t:'3.13 AC',src:'hl',q:'What is the peak value of an AC voltage?',o:['It is the voltage from the centre line to the highest positive or negative value.','It is the voltage from the highest positive to the highest negative value.','It is the value which produce the same heat energy at a resistor as a DC voltage.'],a:0,
 e:'Peak (Vp) วัดจากเส้นศูนย์กลางไปยอดสูงสุดด้านบวกหรือลบ • ตัวเลือกที่ 2 คือ Peak-to-Peak (ยอดบนถึงยอดล่าง = 2×Vp) • ตัวเลือกที่ 3 คือ RMS/Effective value',
 f:'Vpp = 2 × Vp\nV_rms = Vp / √2 = 0.707 × Vp\nVp = 1.414 × V_rms',
 k:'Peak = "ยอดเขา" วัดจากพื้นถึงยอด • Peak-to-Peak = ยอดเขาถึงก้นหุบ • RMS = "ให้ความร้อนเท่า DC" (R-M-S = Real heat)',ref:'PDF 3.13.1.3 Peak / Peak to Peak Value'},
{t:'3.14 R, C, L in AC',src:'hl',q:'Which answer about the capacitive reactance is true?',o:['At zero frequency (DC), reactance is zero. An ideal capacitor offers no opposition to the flow of direct current.','At zero frequency (DC), reactance is infinite, i.e. a capacitor acts as a \'block\' to DC.','For a given applied voltage. As the frequency increases, the reactance increases and, as a result, the current decreases.'],a:1,
 e:'Xc = 1/(2πfC) ที่ f = 0 (DC) ค่า Xc → ∞ จึงกั้น DC • เมื่อความถี่สูงขึ้น Xc ลดลง กระแสเพิ่มขึ้น (ตัวเลือก C กลับด้าน)',
 f:'Xc = 1 / (2π · f · C)\nf ↑ → Xc ↓ → I ↑        f = 0 → Xc = ∞',
 k:'C = "Capacitor Cuts DC, Conducts high frequency" • คู่ตรงข้าม: L = "Lets DC pass, blocks high frequency" (XL = 2πfL ขึ้นตาม f) • Xc ไปทาง f ตรงข้ามกับ XL',ref:'PDF 3.14.1 R, C and L in AC Circuits'},
{t:'3.14 / 3.16 Phase & Filters',src:'hl',q:'What is the phase shift between the current and the apparent voltage in a RC series connection if the circuit operates at cut off frequency?',o:['45°','0°','90°'],a:0,
 e:'ที่ cut-off frequency (f_c) ค่า Xc = R ทำให้แรงดันและกระแสต่างเฟสกัน 45° (arctan(Xc/R) = arctan 1 = 45°) และแรงดันเอาต์พุตเหลือ 70.7% ของอินพุต (−3 dB)',
 f:'f_c = 1 / (2π · R · C)\nXc = R  →  φ = arctan(Xc/R) = 45°\nV_out = 0.707 · V_in  (−3 dB)',
 k:'Cut-off = "สองตัวสู้กันเสมอ" (Xc = R) → 45° • มีเฟส 0° เมื่อมี R อย่างเดียว • 90° เมื่อมี C หรือ L อย่างเดียว',ref:'PDF 3.14 / 3.16.2 Filters'},
{t:'3.14 R, C, L in AC',src:'hl',q:'If the input frequency of a RL series circuit is changed to a higher value, how does the voltage drop across the resistor behave?',o:['The voltage drop will decrease.','The voltage drop will be increase.','The voltage drop will be the same.'],a:0,
 e:'f เพิ่ม → XL = 2πfL เพิ่ม → Z รวมเพิ่ม → กระแสลดลง → V_R = I · R ลดลง (R คงที่) ส่วน V_L เพิ่มขึ้น',
 f:'f ↑ → XL ↑ → Z ↑ → I ↓ → V_R = I·R ↓   (V_L ↑)',

['Voltage ratio equals turns ratio: V1/V2 = N1/N2, so N1 = N2 × V1/V2 = 36 × 220/18 = 440 turns.',

['Single-phase supply gives a pulsating field that does not rotate, so the motor cannot start itself. A starting capacitor feeds an auxiliary winding and shifts its current phase (about 90°), creating a rotating field.',

['The induction motor rotor always turns slower than the rotating field (synchronous speed). That difference is called slip. With equal speeds there would be no induction, so it is not "in sync": asynchronous.',

['Conventional (hole) theory: current flows from + to − in the external circuit. It is the direction used for aircraft DC work and circuit diagrams.',

['Current is the amount of charge passing per unit time: I = Q/t (A = C/s).',

['Electron theory (the real physical direction): electrons are negative, so they are pushed from the negative pole and attracted to the positive pole: − to + in the external circuit.',

['Rearrange I = Q/t to get Q = I · t (C = A·s). For example 1 A for 1 hour = 3600 C = 1 Ah.',

['1 ampere = 1 coulomb (6.28 × 10¹⁸ electrons) passing a point in the circuit in 1 second.',

['Battery = chemical action. Piezo = pressure/stress. Thermocouple = heat at the junction of two different metals.',

['There are two variable resistors: the potentiometer uses 3 terminals (voltage divider) and the rheostat uses 2 terminals (current control). A deposited film resistor has a fixed value.',
 'Pot = 3 legs (divides voltage). Rheo = 2 legs (controls current). "Spring resistor" does not exist: it is a decoy.'],
['A series circuit has one path, so the current is the same everywhere. Voltage drops split according to R (equal only if the resistors are equal), and R_total = R1 + R2 + …',

['The bridge balances when C and B are at the same potential (meter = 0): top-arm ratio equals bottom-arm ratio, 100/Rx = 1000/159, so Rx = 100 × 159 / 1000 = 15.9 Ω.',

['Work/energy = power × time (W = P·t). The unit is Ws (= joule), or Wh, kWh. Watt is power, and VA is apparent power in AC.',

['The dielectric constant (εr) is a multiplier relative to vacuum (= 1). Air is about 1.0006, roughly 1. No material is below 1, so 0 and 0.5 are impossible.',

['A normally open (NO) contact is open in its rest state (no current in the coil). When the coil is energised, its magnetic field attracts the armature, so the contact closes. When the current is cut, the spring returns the armature and the contact opens again.',

['Peak (Vp) is measured from the centre line to the highest positive or negative value. Option 2 is peak-to-peak (top to bottom = 2×Vp). Option 3 is the RMS/effective value.',

['An autotransformer has only one winding, with a tap used as both primary and secondary. It is small, light and saves copper, but gives no isolation between windings.',

['An atom contains protons (+) and neutrons (no charge) in the nucleus, with electrons (−) orbiting around. Neutron = neutral = no charge.',

['A ferromagnetic material (iron etc.) has high permeability, which raises the flux and field strength of the coil by hundreds to thousands of times, so the magnetic force increases. The core does not change the poles.',

['No highlight on the sheet (options written by me). Answer from the PDF: a commutator-type DC generator has a fixed part (stator) carrying the field magnet system (field coils on pole pieces fixed to the yoke/frame), while the rotating part (rotor/armature) carries the armature windings and the commutator.',

  study:'Study mode',studyD:'ไม่จำกัดเวลา (นับเวลาขึ้น) ตอบแล้วเห็นเฉลย คำอธิบาย สูตร และวิธีจำทันที',
  shuffle:'สลับลำดับข้อและตัวเลือก (เหมือนสอบจริง)',go:'เริ่มทำข้อสอบ',keys:'คีย์ลัด: A/B/C เลือก · ←/→ เปลี่ยนข้อ · F ปักธง',
  srcT:'ที่มาของเฉลย',srcP:(a,b,c,d)=>`${a} ข้อเฉลยตามที่ highlight ในชีท · ${b} ข้อที่ไม่มี highlight แต่เฉลยตามไฟล์ข้อสอบเก่า · ${c} ข้อเฉลยจากเนื้อหา PDF Module 3 (ตัวเลือกผมตั้งเอง) มีป้าย PDF · ป้ายข้อสอบเก่าคือข้อที่ตรงกับไฟล์ข้อสอบเก่า ${d} ข้อ`,
  prev:'ผลครั้งก่อน (เครื่องนี้)',q:'Question',submit:'ส่งข้อสอบ',answered:'ตอบแล้ว',prevB:'← ก่อนหน้า',nextB:'ถัดไป →',flagB:'ปักธงไว้ทบทวน',flagged:'ปักธงแล้ว',
  all:'ข้อสอบทั้งหมด',lAns:'■ ตอบแล้ว',lFlag:'● ปักธง',lR:'ถูก',lW:'ผิด',quit:'ออกไปหน้าแรก',
  quitT:'ออกจากการสอบ?',quitM:'คำตอบในรอบนี้จะไม่ถูกบันทึก',quitOk:'ออก',cancel:'ยกเลิก',
  subT:'ส่งข้อสอบ?',subM:(a,n,f)=>`ตอบแล้ว ${a}/${n} ข้อ${n-a?` · ยังไม่ตอบ ${n-a} ข้อ`:''}${f?` · ปักธงไว้ ${f} ข้อ`:''}`,
  ok:'ถูกต้อง',bad:'ยังไม่ถูก',unans:'ไม่ได้ตอบ',key:'เฉลย',trick:'Trick จำ',noHl:'ไม่มี highlight · ',oldTag:'ข้อสอบเก่า',ref:'อ้างอิง',
  rEyebrow:m=>`ผลสอบ · ${m}`,timeout:' · หมดเวลา ส่งอัตโนมัติ',rTitle:'Module 3 Result',rOf:(s,n)=>`ถูก ${s}/${n} ข้อ`,rPassMark:'เกณฑ์',used:'ใช้เวลา',of:'จาก',
  byTopic:'แยกตามหัวข้อ',retryW:'ทำใหม่เฉพาะข้อผิด',retry:'ทำใหม่ทั้งชุด',home:'หน้าแรก',review:'เฉลยและวิธีจำ',fAll:'ทุกข้อ',fWrong:'เฉพาะข้อผิด',perfect:'ไม่มีข้อผิด ยอดเยี่ยม',
  today:'th-TH',n:'Night',themeNight:'โหมดกลางคืน',themeLight:'สว่าง',themeAuto:'อัตโนมัติ',exMode:'Exam',stMode:'Study',pass:'ผ่าน',fail:'ไม่ผ่าน'},
 en:{eyebrow:'EASA Part-66 · CAT B1 / B2',title:'Module 3 Electrical Fundamentals<br>Mock Exam',cond:'Exam conditions',
  condD:n=>`The real Module 3 exam has 52 questions in 65 minutes (75 seconds each). This set has ${n} questions, so the time is scaled the same way.`,
  rQ:'questions (3-option MCQ)',rMin:'minutes · 75 s each',rPass:'pass mark',rPassD:n=>`(≥ ${n} correct)`,rNeg:'No negative marking · no calculator',
  pick:'Choose a mode',exam:'Exam mode',examD:'Countdown timer, no answers while you work, flag doubtful questions, auto-submit at time-out, then review every key and trick at the end.',
  study:'Study mode',studyD:'No time limit (count-up clock). See the key, explanation, formula and memory trick as soon as you answer.',
  shuffle:'Shuffle questions and options (like the real exam)',go:'Start the exam',keys:'Shortcuts: A/B/C choose · ←/→ move · F flag',
  srcT:'Where the answers come from',srcP:(a,b,c,d)=>`${a} answers follow the highlights on the sheet · ${b} had no highlight but follow the past-exam files · ${c} come from the Module 3 PDF (options written by me) and carry a PDF tag · the Past exam tag marks ${d} questions that match the past-exam files`,
  prev:'Previous results (this device)',q:'Question',submit:'Submit exam',answered:'answered',prevB:'← Previous',nextB:'Next →',flagB:'Flag for review',flagged:'Flagged',
  all:'All questions',lAns:'■ answered',lFlag:'● flagged',lR:'right',lW:'wrong',quit:'Back to start',
  quitT:'Leave the exam?',quitM:'Your answers in this attempt will not be saved.',quitOk:'Leave',cancel:'Cancel',
  subT:'Submit the exam?',subM:(a,n,f)=>`Answered ${a}/${n}${n-a?` · ${n-a} unanswered`:''}${f?` · ${f} flagged`:''}`,
  ok:'Correct',bad:'Not quite',unans:'Not answered',key:'Answer',trick:'Memory trick',noHl:'No highlight · ',oldTag:'Past exam',ref:'Source',
  rEyebrow:m=>`Result · ${m}`,timeout:' · time is up, auto-submitted',rTitle:'Module 3 Result',rOf:(s,n)=>`${s}/${n} correct`,rPassMark:'pass mark',used:'time used',of:'of',
  byTopic:'By topic',retryW:'Redo wrong ones',retry:'Redo whole set',home:'Home',review:'Answers and tricks',fAll:'All',fWrong:'Wrong only',perfect:'No mistakes. Excellent',
  today:'en-GB',n:'Night',themeNight:'Night mode',themeLight:'Light',themeAuto:'Auto',exMode:'Exam',stMode:'Study',pass:'PASS',fail:'FAIL'}
};

/* ---------- state ---------- */
const SEC_PER_Q=75, PASS=75;
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const S={lang:store.get('m3p_lang','th'),theme:store.get('m3p_theme','auto'),view:'start',mode:'exam',shuffle:true,order:[],perm:{},ans:{},flags:{},cur:0,end:0,timer:null,finished:false,subset:null,filter:'all'};
const $=s=>document.querySelector(s);
const app=$('#app');
const tr=()=>TX[S.lang];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=s=>{s=Math.max(0,Math.ceil(s));const m=Math.floor(s/60),r=s%60;return `${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`};
const hist={get(){return store.get('m3mock',[])},add(x){const h=hist.get();h.unshift(x);store.set('m3mock',h.slice(0,8))}};
const EXP=i=>S.lang==='en'?EN[i]:[Q[i].e,Q[i].k];

/* theme + toolbar */
function applyTheme(){const r=document.documentElement;if(S.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme==='night'?'dark':'light')}
const ICON={auto:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>',
 light:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
 night:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 13.5A9 9 0 1 1 10.5 3a7 7 0 0 0 10.5 10.5z"/></svg>'};
function toolsHTML(){
  const t=tr(),lab=S.theme==='night'?t.themeNight:S.theme==='light'?t.themeLight:t.themeAuto;
  return `<div class="tools"><div class="seg" role="group" aria-label="Language"><button id="lt" aria-pressed="${S.lang==='th'}">TH</button><button id="le" aria-pressed="${S.lang==='en'}">EN</button></div>
  <a class="thm" href="index.html"  style="text-decoration:none">← Hub</a><button class="thm" id="fs" aria-label="Text size">Aa</button><button class="thm" id="th" aria-label="Theme">${ICON[S.theme]}<span>${esc(lab)}</span></button></div>`;
}
const ZS=[1,1.15,1.3];let zi=+(store.get('m3p_zoom',0))||0;function applyZoom(){document.body.style.zoom=ZS[zi]||1}applyZoom();
function wireTools(){const fz=$('#fs');if(fz)fz.onclick=()=>{zi=(zi+1)%ZS.length;store.set('m3p_zoom',zi);applyZoom()};
  $('#lt').onclick=()=>{S.lang='th';store.set('m3p_lang','th');rerender()};
  $('#le').onclick=()=>{S.lang='en';store.set('m3p_lang','en');rerender()};
  $('#th').onclick=()=>{S.theme={auto:'night',night:'light',light:'auto'}[S.theme];store.set('m3p_theme',S.theme);applyTheme();rerender()};
}
function rerender(){document.documentElement.lang=S.lang;if(S.view==='start')renderStart();else if(S.view==='quiz')renderQuiz();else renderResult()}

/* ---------- start ---------- */
function renderStart(){
  const t=tr(),h=hist.get(),n=Q.length,mins=n*SEC_PER_Q;
  const cnt=k=>Q.filter(q=>q.src===k).length,old=Q.filter(q=>q.x||q.src==='old').length;
  app.innerHTML=`
  <header class="row spread"><div><div class="eyebrow">${t.eyebrow}</div><h1>${t.title}</h1></div>${toolsHTML()}</header>
  <section class="card">
    <h2>${t.cond}</h2>
    <p class="muted" style="margin:6px 0 0">${t.condD(n)}</p>
    <div class="rules">
      <div class="rule"><b>${n}</b><span>${t.rQ}</span></div>
      <div class="rule"><b>${fmt(mins)}</b><span>${t.rMin}</span></div>
      <div class="rule"><b>${PASS}%</b><span>${t.rPass} ${t.rPassD(Math.ceil(n*PASS/100))}</span></div>
      <div class="rule"><b>0</b><span>${t.rNeg}</span></div>
    </div>
  </section>
  <section class="card" style="display:flex;flex-direction:column;gap:14px">
    <h2>${t.pick}</h2>
    <div class="modes">
      <button class="mode" id="m-exam" aria-pressed="${S.mode==='exam'}"><strong>${t.exam}</strong><small>${t.examD}</small></button>
      <button class="mode" id="m-study" aria-pressed="${S.mode==='study'}"><strong>${t.study}</strong><small>${t.studyD}</small></button>
    </div>
    <label class="chk"><input type="checkbox" id="shuf" ${S.shuffle?'checked':''}> ${t.shuffle}</label>
    <div class="row"><button class="primary" id="go">${t.go}</button><span class="muted" style="font-size:.85rem">${t.keys}</span></div>
  </section>
  <section class="card">
    <h2>${t.srcT}</h2>
    <p style="margin:6px 0 0">${t.srcP(cnt('hl'),cnt('old'),cnt('pdf'),old)}</p>
    ${h.length?`<div style="margin-top:12px"><div class="eyebrow">${t.prev}</div>${h.map(x=>`<div class="hist">${esc(x.d)} · ${esc(x.mode)} · ${x.s}/${x.n} (${x.p}%) ${x.p>=PASS?'PASS':'FAIL'} · ${esc(x.t)}</div>`).join('')}</div>`:''}
  </section>`;
  wireTools();
  $('#m-exam').onclick=()=>{S.mode='exam';renderStart()};
  $('#m-study').onclick=()=>{S.mode='study';renderStart()};
  $('#shuf').onchange=e=>S.shuffle=e.target.checked;
  $('#go').onclick=()=>start(null);
}
function start(subset){
  const ids=subset||Q.map((_,i)=>i);
  S.subset=subset;S.order=S.shuffle?shuffle(ids):ids.slice();
  S.perm={};S.order.forEach(i=>S.perm[i]=S.shuffle?shuffle([0,1,2]):[0,1,2]);
  S.ans={};S.flags={};S.cur=0;S.finished=false;S.view='quiz';S.startAt=Date.now();
  S.end=S.mode==='exam'?Date.now()+S.order.length*SEC_PER_Q*1000:0;
  clearInterval(S.timer);S.timer=setInterval(tick,250);
  renderQuiz();window.scrollTo({top:0});
}
function tick(){
  const el=$('#timer');if(!el)return;
  if(S.mode==='exam'){const l=(S.end-Date.now())/1000;el.textContent=fmt(l);el.classList.toggle('warn',l<=300);if(l<=0)finish(true)}
  else el.textContent=fmt((Date.now()-S.startAt)/1000);
}

/* ---------- quiz ---------- */
function optHTML(qi,pos,review){
  const q=Q[qi],oi=S.perm[qi][pos],chosen=S.ans[qi];let cls='opt';
  const reveal=review||(S.mode==='study'&&chosen!==undefined);
  if(reveal){if(oi===q.a)cls+=' right';else if(chosen===oi)cls+=' wrong'}else if(chosen===oi)cls+=' sel';
  return `<button class="${cls}" data-o="${oi}" ${reveal?'disabled':''}><span class="k">${'ABC'[pos]}</span><span class="t">${esc(q.o[oi])}</span></button>`;
}
function expHTML(qi){
  const t=tr(),q=Q[qi],c=S.ans[qi],ok=c===q.a,letter='ABC'[S.perm[qi].indexOf(q.a)],[e,k]=EXP(qi);
  return `<div class="exp">
    <div class="verdict ${c===undefined?'bad':ok?'ok':'bad'}">${c===undefined?t.unans:ok?t.ok:t.bad} · ${t.key} ${letter}. ${esc(q.o[q.a])}</div>
    <p>${esc(e)}</p>
    ${q.f?`<div class="formula">${esc(q.f)}</div>`:''}
    <div class="trick"><b>${t.trick}:</b> ${esc(k)}</div>
    <div class="ref">${q.src==='pdf'?t.noHl:''}${(q.x||q.src==='old')?t.oldTag+' · ':''}${t.ref}: ${esc(q.ref)}</div>
  </div>`;
}
function qCard(qi,num,review){
  const t=tr(),q=Q[qi];
  return `<article class="card">
    <div class="qhead"><span class="qnum">${t.q} ${num} / ${S.order.length}</span><span class="row" style="gap:6px"><span class="tag">${esc(q.t)}</span>${q.src==='pdf'?'<span class="tag pdf">PDF</span>':''}${(q.x||q.src==='old')?`<span class="tag ok">${t.oldTag}</span>`:''}</span></div>
    <div class="qtext">${esc(q.q)}</div>
    ${q.d?`<div class="diagram"><img src="${FIG[q.d]}" alt="Figure for question ${num}"></div>`:''}
    <div class="opts" data-q="${qi}">${[0,1,2].map(p=>optHTML(qi,p,review)).join('')}</div>
    ${review||(S.mode==='study'&&S.ans[qi]!==undefined)?expHTML(qi):''}
  </article>`;
}
function renderQuiz(){
  const t=tr(),qi=S.order[S.cur],answered=Object.keys(S.ans).length,n=S.order.length;
  app.innerHTML=`
  <div class="bar">
    <span class="timer" id="timer">${S.mode==='exam'?fmt((S.end-Date.now())/1000):'00:00'}</span>
    <div class="prog" aria-hidden="true"><i style="width:${answered/n*100}%"></i></div>
    <span class="count">${answered}/${n} ${t.answered}</span>
    <button id="submit" class="${answered===n?'primary':''}">${t.submit}</button>
  </div>
  <div class="row spread">${toolsHTML()}</div>
  ${qCard(qi,S.cur+1,false)}
  <div class="row spread">
    <button id="prev" ${S.cur===0?'disabled':''}>${t.prevB}</button>
    ${S.mode==='exam'?`<button class="flagbtn" id="flag" aria-pressed="${!!S.flags[qi]}">${S.flags[qi]?t.flagged:t.flagB}</button>`:''}
    <button id="next" class="primary" ${S.cur===n-1?'disabled':''}>${t.nextB}</button>
  </div>
  <section class="card">
    <div class="row spread" style="margin-bottom:10px"><h2>${t.all}</h2>
    <div class="legend"><span>${t.lAns}</span><span style="color:var(--flag)">${t.lFlag}</span>${S.mode==='study'?`<span style="color:var(--ok)">${t.lR}</span><span style="color:var(--bad)">${t.lW}</span>`:''}</div></div>
    <div class="nav">${S.order.map((id,i)=>{let c='';if(S.ans[id]!==undefined)c+=S.mode==='study'?(S.ans[id]===Q[id].a?' r':' w'):' ans';if(S.flags[id])c+=' flg';if(i===S.cur)c+=' cur';return `<button class="${c}" data-i="${i}" aria-label="${i+1}">${i+1}</button>`}).join('')}</div>
  </section>
  <div class="row"><button id="quit">${t.quit}</button></div>`;
  wireTools();
  app.querySelectorAll('.opts .opt').forEach(b=>b.onclick=()=>choose(+b.dataset.o));
  app.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{S.cur=+b.dataset.i;renderQuiz()});
  $('#prev').onclick=()=>go(-1);$('#next').onclick=()=>go(1);
  if($('#flag'))$('#flag').onclick=toggleFlag;
  $('#submit').onclick=confirmSubmit;
  $('#quit').onclick=()=>confirmBox(t.quitT,t.quitM,t.quitOk,()=>{clearInterval(S.timer);S.view='start';renderStart()});
  tick();
}
function choose(oi){const qi=S.order[S.cur];if(S.mode==='study'&&S.ans[qi]!==undefined)return;S.ans[qi]=oi;renderQuiz()}
function go(d){const n=S.order.length;S.cur=Math.min(n-1,Math.max(0,S.cur+d));renderQuiz();window.scrollTo({top:0})}
function toggleFlag(){const qi=S.order[S.cur];S.flags[qi]=!S.flags[qi];renderQuiz()}
function confirmBox(title,msg,ok,cb){
  const t=tr(),m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="card" role="dialog" aria-modal="true"><h2>${esc(title)}</h2><p>${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button id="mc">${t.cancel}</button><button class="primary" id="mo">${esc(ok)}</button></div></div>`;
  document.body.appendChild(m);m.querySelector('#mo').focus();
  m.querySelector('#mc').onclick=()=>m.remove();m.querySelector('#mo').onclick=()=>{m.remove();cb()};
}
function confirmSubmit(){
  const t=tr(),n=S.order.length,a=Object.keys(S.ans).length,f=Object.values(S.flags).filter(Boolean).length;
  confirmBox(t.subT,t.subM(a,n,f),t.submit,()=>finish(false));
}

/* ---------- result ---------- */
function finish(timeout){
  if(S.finished)return;S.finished=true;clearInterval(S.timer);document.querySelectorAll('.modal').forEach(m=>m.remove());
  const n=S.order.length,s=S.order.filter(i=>S.ans[i]===Q[i].a).length,p=Math.round(s/n*100),used=(Date.now()-S.startAt)/1000;
  S.result={n,s,p,used,timeout};
  hist.add({d:new Date().toLocaleDateString(tr().today,{day:'numeric',month:'short'}),mode:S.mode==='exam'?'Exam':'Study',s,n,p,t:fmt(used)});
  S.view='result';S.filter='all';renderResult();window.scrollTo({top:0});
}
function renderResult(){
  const t=tr(),{n,s,p,used,timeout}=S.result,pass=p>=PASS;
  const by={};S.order.forEach(i=>{const k=Q[i].t;by[k]=by[k]||{c:0,n:0};by[k].n++;if(S.ans[i]===Q[i].a)by[k].c++});
  const wrong=S.order.filter(i=>S.ans[i]!==Q[i].a),list=S.filter==='wrong'?wrong:S.order;
  app.innerHTML=`
  <header class="row spread"><div><div class="eyebrow">${t.rEyebrow(S.mode==='exam'?t.exam:t.study)}${timeout?t.timeout:''}</div><h1>${t.rTitle}</h1></div>${toolsHTML()}</header>
  <section class="card" style="display:flex;flex-direction:column;gap:14px">
    <div class="score"><span class="big">${p}%</span><span class="stamp ${pass?'pass':'fail'}">${pass?t.pass:t.fail}</span>
      <span class="muted">${t.rOf(s,n)} · ${t.rPassMark} ${PASS}% · ${t.used} ${fmt(used)}${S.mode==='exam'?` ${t.of} ${fmt(n*SEC_PER_Q)}`:''}</span></div>
    <div><div class="eyebrow">${t.byTopic}</div><div class="topics">${Object.entries(by).map(([k,v])=>`<div class="trow"><span>${esc(k)}</span><span class="tbar"><i style="width:${v.c/v.n*100}%;${v.c/v.n<.75?'background:var(--bad)':''}"></i></span><span class="n">${v.c}/${v.n}</span></div>`).join('')}</div></div>
    <div class="row">${wrong.length?`<button class="primary" id="retryW">${t.retryW} (${wrong.length})</button>`:''}<button id="retry">${t.retry}</button><button id="home">${t.home}</button></div>
  </section>
  <div class="row spread"><h2>${t.review}</h2><div class="row" style="gap:6px">
    <button id="fa" class="${S.filter==='all'?'primary':''}">${t.fAll}</button><button id="fw" class="${S.filter==='wrong'?'primary':''}">${t.fWrong}</button></div></div>
  <div class="review">${list.length?list.map(i=>qCard(i,S.order.indexOf(i)+1,true)).join(''):`<div class="card">${t.perfect}</div>`}</div>`;
  wireTools();
  if($('#retryW'))$('#retryW').onclick=()=>start(wrong);
  $('#retry').onclick=()=>start(null);$('#home').onclick=()=>{S.view='start';renderStart()};
  $('#fa').onclick=()=>{S.filter='all';renderResult()};$('#fw').onclick=()=>{S.filter='wrong';renderResult()};
}
document.addEventListener('keydown',e=>{
  if(S.view!=='quiz'||document.querySelector('.modal')||e.target.tagName==='INPUT')return;
  const k=e.key.toLowerCase();
  if(['a','b','c','1','2','3'].includes(k)){const pos={a:0,b:1,c:2,1:0,2:1,3:2}[k];choose(S.perm[S.order[S.cur]][pos])}
  else if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);
  else if(k==='f'&&S.mode==='exam')toggleFlag();
});
applyTheme();document.documentElement.lang=S.lang;renderStart();
</script>

</body>
</html>
