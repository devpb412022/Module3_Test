<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Module 3 Practice Drills</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: single drill column. Header strip (language + theme) over topic picker, then one-question-at-a-time card with instant explanation. */
:root{
  --bg:#e9edf1; --surface:#ffffff; --surface-2:#f4f6f8; --ink:#13202b; --muted:#5a6773; --line:#d3dae1;
  --accent:#e6a11a; --accent-ink:#3b2900; --hl:#ffe46b; --hl-ink:#13202b; --ok:#1f8a4c; --ok-bg:#e3f4ea; --bad:#c23b2e; --bad-bg:#fbe7e4; --flag:#2f6fd0;
  --f-display:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#090d12; --surface:#121921; --surface-2:#18212b; --ink:#dde4ea; --muted:#8a97a3; --line:#25303b;
  --accent:#e9ad3a; --accent-ink:#1f1500; --hl:#4a3d0c; --hl-ink:#f3e7b3; --ok:#4cc27e; --ok-bg:#12281b; --bad:#ee6b5d; --bad-bg:#331714; --flag:#6aa3ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#090d12; --surface:#121921; --surface-2:#18212b; --ink:#dde4ea; --muted:#8a97a3; --line:#25303b;
  --accent:#e9ad3a; --accent-ink:#1f1500; --hl:#4a3d0c; --hl-ink:#f3e7b3; --ok:#4cc27e; --ok-bg:#12281b; --bad:#ee6b5d; --bad-bg:#331714; --flag:#6aa3ff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;transition:background .2s,color .2s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:clamp(1.6rem,4.5vw,2.2rem);font-weight:700}
h2{font-size:1.2rem;font-weight:600}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.muted{color:var(--muted)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:9px 14px;min-height:44px}
button:hover{border-color:var(--muted)}
button:focus-visible,.opt:focus-visible{outline:3px solid var(--flag);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}

/* toolbar */
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--surface);min-height:40px;padding:6px 14px;font-family:var(--f-mono);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.thm{display:inline-flex;gap:8px;align-items:center;min-height:40px;padding:6px 12px}
.thm svg{width:18px;height:18px;flex:none}

/* home */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;gap:8px;align-items:center;border-radius:99px;padding:6px 14px;min-height:40px}
.chip[aria-pressed="true"]{border:2px solid var(--accent);background:var(--surface-2);font-weight:600}
.chip b{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-weight:500}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.mode{text-align:left;padding:14px;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
.mode[aria-pressed="true"]{border:2px solid var(--accent);background:var(--surface-2)}
.mode strong{font-family:var(--f-display)}
.mode small{color:var(--muted);font-size:.88rem;line-height:1.5}
label.chk{display:flex;gap:8px;align-items:center}
select{font:inherit;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:44px}
.note{font-size:.88rem;color:var(--muted)}

/* drill */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.prog{flex:1;min-width:110px;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.count{font-family:var(--f-mono);font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.qnum{font-family:var(--f-mono);font-weight:600}
.tag{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.04em;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.pdf{border-color:var(--flag);color:var(--flag)}
.tag.warn{border-color:var(--bad);color:var(--bad)}
.qtext{font-size:1.12rem;font-weight:500;margin:10px 0 14px;font-style:italic}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;background:var(--surface);width:100%}
.opt .k{font-family:var(--f-mono);font-weight:600;min-width:1.6em;height:1.6em;border-radius:50%;border:1.5px solid var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;flex:none;margin-top:2px}
.opt .t{min-width:0}
.opt.sel{border:2px solid var(--accent);background:var(--surface-2)}
.opt.sel .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border:2px solid var(--ok);background:var(--ok-bg)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border:2px solid var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt[disabled]{opacity:1;cursor:default}
.exp{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.exp p{margin:0}
.verdict{font-family:var(--f-display);font-weight:600;font-size:1.05rem}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.trick{background:var(--hl);color:var(--hl-ink);border-radius:6px;padding:10px 12px}
.trick b{font-family:var(--f-display)}
.formula{font-family:var(--f-mono);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;overflow-x:auto;white-space:pre;font-size:.9rem}
.warnbox{border:1px solid var(--bad);background:var(--bad-bg);border-radius:6px;padding:8px 12px;font-size:.9rem}

/* result */
.score{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.big{font-family:var(--f-mono);font-size:clamp(2.6rem,9vw,3.4rem);font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.topics{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 120px 48px;gap:10px;align-items:center;font-size:.9rem}
.tbar{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--ok)}
.trow .n{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.review{display:flex;flex-direction:column;gap:14px}
@media (max-width:520px){.card{padding:16px}.trow{grid-template-columns:minmax(0,1fr) 70px 44px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.diagram{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:14px;display:flex;justify-content:center;background:#fff}.diagram img{max-width:100%;height:auto;display:block}
</style>
</head>

/* --- atom, charge, current --- */
add('atom','What are valence-electrons?',['Electrons on the outer unsaturated shell of an atom.','Electrons located inside the nucleus.','Electrons on the innermost shell of an atom.'],0,
 ['วาเลนซ์อิเล็กตรอนคืออิเล็กตรอนในวงนอกสุดที่ยังไม่เต็ม หลุดง่ายและทำให้เกิดการนำไฟฟ้า','Valence = วงนอกสุด (outer) • ตัวนำมี 1–3 ตัว หลุดง่าย • ฉนวนวงนอกเต็ม'],
 ['Valence electrons sit in the outermost, unfilled shell. They are loosely bound, so they can be freed to carry current.','Valence = outer. Conductors have 1–3 (easy to free); insulators have a full outer shell.']);
add('atom','How many valence-electrons do semiconductors have?',['Semiconductors have exactly 2 valence-electrons.','Semiconductors have exactly 4 valence-electrons.','Semiconductors have exactly 8 valence-electrons.'],1,
 ['สารกึ่งตัวนำ (ซิลิคอน เจอร์เมเนียม) มี 4 ตัวในวงนอก อยู่กึ่งกลางระหว่างตัวนำ (1–3) กับฉนวน (8)','4 = กึ่งกลาง: ตัวนำ 1–3 < กึ่งตัวนำ 4 < ฉนวน 8'],
 ['Semiconductors such as silicon and germanium have 4 electrons in the outer ring, between conductors (1–3) and insulators (8).','4 = in the middle: conductor 1–3 < semiconductor 4 < insulator 8.']);
add('atom','Which particles are part of the nucleus?',['Protons and electrons','Neutrons and protons','Electrons and neutrons'],1,
 ['นิวเคลียสประกอบด้วยโปรตอน (+) และนิวตรอน (เป็นกลาง) ส่วนอิเล็กตรอน (−) วิ่งรอบนอก','"นิวเคลียส = นิวตรอน + โปรตอน" (N กับ P อยู่ข้างใน) อิเล็กตรอนอยู่วงนอกเสมอ'],
 ['The nucleus contains protons (+) and neutrons (neutral). Electrons (−) orbit outside it.','Nucleus = Neutrons + Protons (N and P inside). Electrons are always outside.']);
add('atom','What is static electricity?',['A continuous flow of electrons in a closed circuit.','A voltage potential with no electron flow.','An alternating current at a very low frequency.'],1,
 ['ไฟฟ้าสถิตคือความต่างศักย์ที่เกิดจากประจุสะสม โดยไม่มีอิเล็กตรอนไหล เช่น ฟ้าผ่า การเสียดสี','Static = "นิ่ง" = มีแรงดัน แต่ไม่มีกระแสไหล'],
 ['Static electricity is a potential difference built up by trapped charge, with no electron flow (for example friction or lightning).','Static = stationary: voltage yes, current no.']);
add('atom','Which statement about charge is true?',['A positive charged particle is attracted by a negative charged particle.','Two positive charged particles attract each other.','Two negative charged particles attract each other.'],0,
 ['ประจุต่างชนิดดูดกัน ประจุชนิดเดียวกันผลักกัน (กฎของคูลอมบ์)','ต่างขั้ว = ดูด • ขั้วเดียวกัน = ผลัก (เหมือนแม่เหล็ก)'],
 ['Unlike charges attract and like charges repel (Coulomb\'s law).','Opposites attract, likes repel, same as magnets.']);
add('atom','What is the process called when friction is changed into potential difference (PD)?',['Piezo effect','Static electricity','Photoelectric effect'],1,
 ['การเสียดสีทำให้ประจุถูกถ่ายโอนและสะสมเป็นความต่างศักย์ เรียกว่าไฟฟ้าสถิต (Piezo = แรงกด, Photoelectric = แสง)','จับคู่ 3 แหล่ง: เสียดสี = Static • กด = Piezo • แสง = Photo'],
 ['Rubbing surfaces transfers and stores charge as a potential difference: static electricity. (Piezo = pressure, photoelectric = light.)','Match the source: friction = static, pressure = piezo, light = photo.']);
add('atom','How many Coulomb are 1 ampere hour?',['60 C','360 C','3600 C'],2,
 ['1 A = 1 C ต่อวินาที และ 1 ชั่วโมง = 3600 วินาที ดังนั้น 1 Ah = 3600 C','1 ชั่วโมง = 3600 วินาที → 1 Ah = 3600 C'],
 ['1 A is 1 C per second and 1 hour is 3600 s, so 1 Ah = 3600 C.','1 hour = 3600 s → 1 Ah = 3600 C.'],'Q = I · t = 1 A × 3600 s = 3600 C');
add('atom','How many electrons are 1 Coulomb?',['6.28 · 10⁹','6.28 · 10¹⁸','1.6 · 10⁻¹⁹'],1,
 ['1 คูลอมบ์ = ประจุของอิเล็กตรอน 6.28 × 10¹⁸ ตัว (1.6 × 10⁻¹⁹ คือประจุของอิเล็กตรอน 1 ตัว ตัวหลอก)','จำ "6.28 = 2π" และเลขยกกำลัง 18'],
 ['1 coulomb is the charge of 6.28 × 10¹⁸ electrons. (1.6 × 10⁻¹⁹ C is the charge of one electron, a trap.)','Remember "6.28 = 2π" and the exponent 18.']);
add('atom','What is the Unit of the electrical current?',['Coulomb','Volt','Ampere'],2,
 ['หน่วยของกระแสคือแอมแปร์ (A) Coulomb คือหน่วยประจุ Volt คือหน่วยแรงดัน','I → A • Q → C • V → V (ตัวอักษรไม่ตรงกับหน่วยเสมอไป ต้องจำ I = Ampere)'],
 ['Current is measured in amperes (A). Coulomb is charge and volt is potential difference.','I → A, Q → C, V → V.']);

/* --- sources & cells --- */
add('src','What are photovoltaic cells?',['Cells which change heat energy into electrical energy.','Cells which change light energy into electrical energy.','Cells which change pressure into electrical energy.'],1,
 ['Photovoltaic (PV) cell หรือเซลล์แสงอาทิตย์ เปลี่ยนพลังงานแสงเป็นไฟฟ้า','Photo = แสง • Thermo = ความร้อน • Piezo = แรงกด'],
 ['A photovoltaic (solar) cell converts light into electricity.','Photo = light, Thermo = heat, Piezo = pressure.']);
add('src','What do you call the effect when pressure changes produce an electric potential difference (PD)?',['Seebeck effect','Piezo effect','Photoelectric effect'],1,
 ['ผลึก เช่น ควอตซ์ เมื่อถูกกดหรือบีบ จะเกิดความต่างศักย์ เรียก Piezoelectric effect','Piezo มาจากภาษากรีก "กด" = Pressure'],
 ['Crystals such as quartz produce a PD when squeezed: the piezoelectric effect.','Piezo comes from Greek for "press".']);
add('src','What is the cell nominal voltage value of a NiCd battery?',['1.2 V','1.5 V','2.0 V'],0,
 ['เซลล์ NiCd มีแรงดันปกติ 1.2 V ต่อเซลล์ (ตัวอย่าง 20 เซลล์ = 24 V) 2.0 V คือตะกั่วกรด, 1.5 V คือถ่านแห้ง','NiCd = 1.2 V • Lead-acid = 2.0 V • ถ่านซิงค์คาร์บอน = 1.5 V'],
 ['A NiCd cell is nominally 1.2 V (20 cells = 24 V). Lead-acid is 2.0 V and zinc-carbon is 1.5 V.','NiCd 1.2 V, lead-acid 2.0 V, zinc-carbon 1.5 V.']);
add('src','What is a secondary cell?',['It is a type of battery which is not rechargeable.','It is a type of battery which is rechargeable.','It is a cell used only as a back-up for the primary cell.'],1,
 ['Secondary cell คือแบตเตอรี่ชาร์จซ้ำได้ (ตะกั่วกรด NiCd) ส่วน primary ใช้แล้วทิ้ง','Secondary = "รอบสอง" ชาร์จใหม่ได้ • Primary = ครั้งเดียว'],
 ['A secondary cell can be recharged (lead-acid, NiCd). A primary cell cannot.','Secondary = second life (rechargeable). Primary = one use.']);
add('src','What is a primary cell?',['It is a type of battery which is rechargeable.','It is the main cell in a battery pack.','It is a type of battery which is not rechargeable.'],2,
 ['Primary cell ปฏิกิริยาเคมีย้อนกลับไม่ได้ ชาร์จไม่ได้ เช่น ถ่านซิงค์คาร์บอน','Primary = ใช้ครั้งเดียว ทิ้ง'],
 ['In a primary cell the chemical reaction cannot be reversed, so it cannot be recharged (for example zinc-carbon).','Primary = use once, throw away.']);
add('src','Which statement about the thermocouple is correct?',['The thermocouple changes electrical energy into heat energy.','The thermocouple changes light energy into electrical energy.','The thermocouple changes heat energy into electrical energy.'],2,
 ['Thermocouple คือโลหะ 2 ชนิดต่อกัน เมื่อรอยต่อร้อนจะเกิดแรงดัน (เปลี่ยนความร้อนเป็นไฟฟ้า) ใช้วัดอุณหภูมิ EGT/CHT','Thermo = ความร้อน → ไฟฟ้า (ใช้วัดอุณหภูมิเครื่องยนต์)'],
 ['A thermocouple joins two dissimilar metals; a hot junction creates a voltage (heat to electricity). It is used for EGT/CHT.','Thermo = heat in, voltage out.']);
add('src','Which statement about the poles of a battery is correct?',['The plus pole is called anode, the minus pole is called cathode.','The plus pole is called cathode, the minus pole is called anode.','Both poles are called cathode.'],1,
 ['ตามตำราของ Module 3: ขั้วบวก = cathode (ขั้วแท่งคาร์บอน), ขั้วลบ = anode (สังกะสี)','Module 3: Cathode = บวก (+) • Anode = ลบ (−) สำหรับแบตเตอรี่ (CAP: Cathode = Plus)'],
 ['In the Module 3 notes the plus pole is the cathode (carbon rod) and the minus pole is the anode (zinc).','For batteries: Cathode = Plus (C-A-P).']);
add('src','There is a series connection of cells. Which statement about the internal resistance is true?',['The internal resistance of the series connection is lower than the internal resistance of a single cell.','The internal resistance of the series connection is higher than the internal resistance of a single cell.','The internal resistance does not change.'],1,
 ['ต่อเซลล์อนุกรม ความต้านทานภายในรวมกัน (บวกกัน) จึงสูงกว่าเซลล์เดี่ยว แรงดันก็บวกกันด้วย','อนุกรม = ทุกอย่างบวก: แรงดันบวก ความต้านทานภายในบวก'],
 ['In series the cells\' internal resistances add, so the total is higher than one cell. Voltages add too.','Series = everything adds: voltage and internal resistance.']);
add('src','What are the 3 main DC sources?',['Generators, Transformers, Rectifiers','Batteries, Thermocouples, Photocells','Capacitors, Inductors, Resistors'],1,
 ['Module 3.5 บอกแหล่ง DC นิ่ง 3 แบบ: แบตเตอรี่ เทอร์โมคัปเปิล และโฟโตเซลล์','จำ "B-T-P": Battery • Thermocouple • Photocell'],
 ['Module 3.5 lists three stable DC sources: batteries, thermocouples and photocells.','Remember B-T-P: Battery, Thermocouple, Photocell.']);

/* --- resistance & DC --- */
add('res','What is the correct formula of Ohm\'s law?',['I · R = V','I = R / V','V = I / R'],0,
 ['กฎของโอห์ม V = I · R ตัวเลือกที่ผิดคือสลับตำแหน่งตัวแปร','สามเหลี่ยม V บน, I กับ R ล่าง: ปิด V = I×R • ปิด I = V/R • ปิด R = V/I'],
 ['Ohm\'s law is V = I · R. The wrong options swap the variables.','Triangle: V on top, I and R below. Cover V → I×R; cover I → V/R.'],'V = I · R   I = V / R   R = V / I');
add('res','What will happen if you measure the resistance value of a resistor with an applied voltage?',['The meter will show a value that is too high.','The meter will be damaged.','The meter will show zero.'],1,
 ['โอห์มมิเตอร์มีแบตเตอรี่ในตัวเอง ถ้ามีแรงดันภายนอกเข้ามาจะทำให้มิเตอร์เสียหายและค่าผิด ต้องตัดไฟ/ถอดตัวต้านทานก่อนวัด','วัด R = ต้อง "ไม่มีไฟ" เสมอ (power off)'],
 ['An ohmmeter has its own battery. External voltage can damage it and spoil the reading, so measure resistance with power off.','Measure R only with power off.']);
add('res','What is the voltage drop VR1 on the resistor R1 if the input voltage is 10V and the voltage drop VR2 is 7V?',['17 volt','7 volt','3 volt'],2,
 ['อนุกรม: แรงดันตกคร่อมทุกตัวรวมกัน = แรงดันแหล่งจ่าย (Kirchhoff ข้อ 2) VR1 = 10 − 7 = 3 V. ในรูป R1 กับ R2 ต่ออนุกรมกัน','V_total = V1 + V2 → V1 = 10 − 7 = 3 V'],
 ['In series the voltage drops add up to the supply (Kirchhoff\'s second law): VR1 = 10 − 7 = 3 V. (In the figure R1 and R2 are in series.)','V_total = V1 + V2, so V1 = 10 − 7 = 3 V.'],'VR1 = V_in − VR2 = 10 − 7 = 3 V',undefined,'divider');
/* --- figure questions --- */
add('atom','Which path is used by the electron?',['Path A','Path B','Path C'],0,
 ['อิเล็กตรอนมีประจุลบ จึงเคลื่อนที่จากขั้วลบไปขั้วบวก (ตรงข้ามกับทิศทางกระแสตามแบบแผน) ให้ดูลูกศรในรูปว่าเส้นทางไหนไหลออกจากขั้วลบ ข้อสอบจริงเฉลย Path A','อิเล็กตรอน = ลบ → วิ่งจาก − ไป + (กระแสแบบแผนวิ่งสวนทาง)'],
 ['Electrons are negative, so they flow from the negative terminal to the positive terminal (opposite to conventional current). The past exam key is Path A.','Electron = negative: it runs from − to +; conventional current runs the other way.'],'electron flow: − → +',undefined,'electron');
add('mag','The Diagramm shows the current flow by charging/discharging a?',['Coil','Capacitor','Resistor'],0,
 ['กราฟกระแสค่อยๆ เพิ่มขึ้นช้าๆ ตอนต่อไฟและลดลงตอนปลดไฟ เป็นพฤติกรรมของคอยล์ (ตัวเหนี่ยวนำ) ที่ต้านการเปลี่ยนแปลงกระแส ส่วนตัวเก็บประจุกระแสจะกระโดดสูงสุดแล้วค่อยลดลง','คอยล์: กระแสค่อยๆ ขึ้น | คาปาซิเตอร์: กระแสพุ่งก่อนแล้วลด'],
 ['The current rises gradually when switched on and decays when switched off. That is a coil (inductor), which opposes changes in current. A capacitor shows the opposite: current jumps first, then falls.','Coil: current climbs slowly. Capacitor: current spikes first, then falls.'],'τ = L / R',undefined,'curve');
add('ac','What is the peak to peak voltage of the shown voltage curve?',['10 volt','20 volt','14.1 volt'],1,
 ['ค่า peak-to-peak วัดจากยอดบวกถึงยอดลบ = 2 × Vp ในรูปยอด ±10 V จึงได้ 20 V','Vpp = 2 × Vp = 2 × 10 = 20 V'],
 ['Peak-to-peak is measured from the positive peak to the negative peak = 2 × Vp. The curve peaks at ±10 V, so Vpp = 20 V.','Vpp = 2 × Vp = 2 × 10 = 20 V.'],'Vpp = 2·Vp',undefined,'sine');
add('pow','What type of matching is shown in the circuit?',['Voltage matching','Current matching','Power matching'],0,
 ['วงจรให้ความต้านทานโหลดสูงกว่าความต้านทานภายในแหล่งจ่ายมาก เพื่อให้แรงดันตกคร่อมโหลดมากที่สุด เรียกว่า Voltage matching (ข้อสอบจริงเฉลย Voltage matching)','Voltage matching: โหลดสูง → ได้แรงดันมากสุด | Power matching: R โหลด = R ภายใน'],
 ['The load resistance is much higher than the source resistance so the load receives the most voltage: voltage matching (past exam key).','Voltage matching: high load R, max voltage. Power matching: R load = R source.'],'',undefined,'match');
add('res','How much terminals are used by a rheostat?',['2','3','4'],0,
 ['Rheostat ใช้ 2 ขั้ว (ปรับกระแส) ส่วน Potentiometer ใช้ 3 ขั้ว (แบ่งแรงดัน)','Rheo = 2 • Pot = 3'],
 ['A rheostat uses 2 terminals (current control). A potentiometer uses 3 (voltage divider).','Rheostat = 2, potentiometer = 3.']);
add('res','What is the electrical conductance?',['The electrical conductance is the reciprocal of the resistance, G = 1 / R.','The electrical conductance is the product of voltage and current.','The electrical conductance is the same as resistance.'],0,
 ['Conductance G = 1/R หน่วย Siemens (S) ยิ่งนำไฟได้ดี G ยิ่งสูง','G = 1/R (R กลับหัว) หน่วย S'],
 ['Conductance G = 1/R, unit siemens (S). The better the conductor, the higher G.','G is R upside down, unit S.'],'G = 1 / R   [Siemens, S]');
add('res','Which statement about Kirchhoff\'s first law is true?',['The algebraic sum of the voltages in a closed loop is zero.','The algebraic sum of the currents in a junction will be zero.','The total resistance is the sum of all resistors.'],1,
 ['กฎข้อแรก (กฎกระแส): กระแสเข้าจุดต่อ = กระแสออก ผลรวมพีชคณิตเป็นศูนย์ ส่วนผลรวมแรงดันในลูป = 0 คือข้อ 2','ข้อ 1 = กระแส (Current) ที่จุดต่อ • ข้อ 2 = แรงดัน (Voltage) ในลูป'],
 ['The first (current) law: current into a junction equals current out; the algebraic sum is zero. The loop-voltage rule is the second law.','1st law = Current at a junction, 2nd law = Voltage around a loop.'],'ΣI (junction) = 0   ΣV (loop) = 0');
add('res','Which statement about the total resistance of a parallel connection of resistors is true?',['The total resistance is always higher than the highest resistor in the circuit.','The total resistance is the sum of all resistors.','The total resistance is always lower than the lowest resistor in the circuit.'],2,
 ['ขนานเพิ่มทางให้กระแส ความต้านทานรวมจึงลดลง ต่ำกว่าตัวที่เล็กที่สุดเสมอ','ขนาน = รวมแล้ว "น้อยกว่าตัวเล็กสุด" (ตัวเท่ากัน n ตัว = R÷n)'],
 ['Parallel paths add more routes for current, so total R is always below the smallest resistor.','Parallel: total < smallest. n equal resistors = R ÷ n.'],'1/R_T = 1/R1 + 1/R2 + …');
add('res','In which way is the resistance value of a composite resistor changed?',['If there is a high ratio of carbon in the mixture, the resistance value is high.','If there is a high ratio of carbon in the mixture, the resistance value is low.','The resistance depends only on the length of the resistor.'],1,
 ['Composite resistor ทำจากผงคาร์บอนผสมเรซิน คาร์บอนมากนำไฟดี ความต้านทานจึงต่ำ','คาร์บอนมาก = นำไฟมาก = R ต่ำ'],
 ['A composite resistor is carbon powder mixed with resin binder. More carbon conducts better, so resistance is lower.','More carbon, lower R.']);
add('res','What is the use of a Wheatstone bridge?',['It is used to find an unknown resistor.','It is used to step up a voltage.','It is used to rectify an AC voltage.'],0,
 ['Wheatstone bridge ใช้หาค่าความต้านทานที่ไม่ทราบค่า (Rx) โดยปรับจนบริดจ์สมดุล (มิเตอร์ = 0)','Wheatstone = หา Rx (ปรับจน null)'],
 ['A Wheatstone bridge finds an unknown resistance Rx by balancing the bridge until the meter reads zero.','Wheatstone = find Rx (null method).']);
add('res','Which statement about a PTC-resistor is true?',['When the temperature goes up, the resistance value goes up.','When the temperature goes up, the resistance value goes down.','The resistance value does not depend on the temperature.'],0,
 ['PTC = Positive Temperature Coefficient: อุณหภูมิสูง R สูง (โลหะทั่วไป) ส่วน NTC เป็นตรงข้าม. ข้อควรระวัง: เฉลยในไฟล์ Train_M3_some_answer เขียนว่า "R ลดลง" ซึ่งขัดกับตำรา ผมใช้คำตอบตามตำรา','P = Positive = ขึ้นตามกัน • N = Negative = สวนทางกัน'],
 ['PTC = Positive Temperature Coefficient: hotter means higher R (metals). NTC is the opposite. Note: the answer key in "Train M3 some answer" says "goes down", which conflicts with the course text, so the textbook answer is used.','P = Positive: both rise together. N = Negative: opposite.'],
 'PTC: T ↑ → R ↑      NTC: T ↑ → R ↓','เฉลยในไฟล์ขัดกับตำรา / key conflicts with text');

/* --- power --- */
add('pow','How many watts correspond to 20 kW?',['200 W','2,000 W','20,000 W'],2,
 ['k = กิโล = ×1000 ดังนั้น 20 kW = 20,000 W','กิโล = พัน • เมกะ = ล้าน • มิลลิ = หนึ่งในพัน'],
 ['k (kilo) = ×1000, so 20 kW = 20,000 W.','kilo = thousand, mega = million, milli = one thousandth.']);
add('pow','What is the voltage on the load resistor if the electromotive force (EMF) is 12 V and we have power matching conditions?',['3 V','6 V','12 V'],1,
 ['Power matching: R โหลด = R ภายใน แรงดันแบ่งครึ่ง โหลดได้ 6 V (ประสิทธิภาพ 50%)','Matching = เท่ากัน = แบ่งครึ่ง: 12 ÷ 2 = 6 V'],
 ['At power matching the load R equals the source\'s internal R, so the EMF splits equally: 6 V across the load (50 % efficiency).','Matched = equal split: 12 ÷ 2 = 6 V.'],'R_L = R_i → V_L = EMF / 2 = 6 V');
add('pow','What is the correct formula to calculate the electrical power?',['P = I · R','P = I² · R','P = V² · R'],1,
 ['สูตรกำลัง: P = V·I = I²·R = V²/R (ตัวเลือก P = V²·R และ P = I·R ผิด)','P = I²R ("ไอสแควร์อาร์") • P = V²/R (V ต้องหารด้วย R)'],
 ['Power: P = V·I = I²·R = V²/R. P = I·R and P = V²·R are wrong.','P = I²R, and P = V²/R (divide by R).'],'P = V · I = I² · R = V² / R');

/* --- capacitors --- */
add('cap','Which statement about a capacitor is true?',['If the voltage across the plates of a capacitor is doubled, the charge is also doubled.','If the voltage across the plates is doubled, the charge is halved.','The charge does not depend on the voltage.'],0,
 ['Q = C · V ถ้า C คงที่ Q เป็นสัดส่วนตรงกับ V แรงดันเพิ่ม 2 เท่า ประจุเพิ่ม 2 เท่า','Q = C·V: V ×2 → Q ×2'],
 ['Q = C · V. With fixed C, charge is proportional to voltage: double V, double Q.','Q = CV: V × 2 → Q × 2.'],'Q = C · V');
add('cap','What describes the capacitance?',['It is the ability of a system to store electrical charge.','It is the opposition to current flow.','It is the ability to produce a magnetic field.'],0,
 ['Capacitance (C) คือความสามารถในการเก็บประจุไฟฟ้า หน่วยฟารัด (F)','C = Capacity = ความจุ เก็บประจุ'],
 ['Capacitance (C) is the ability to store electrical charge, in farads (F).','C = capacity to store charge.']);
add('cap','After which time is a capacitor fully charged?',['1 tau','3 tau','5 tau'],2,
 ['ที่ 5τ (5·R·C) ตัวเก็บประจุถือว่าชาร์จเต็ม (ประมาณ 99.3%) กระแสเกือบเป็นศูนย์','1τ = 63% • 5τ = เต็ม (จำเลข 5)'],
 ['At 5τ (5·R·C) the capacitor is considered fully charged (about 99.3 %) and current is nearly zero.','1τ = 63 %, 5τ = full.'],'τ = R · C    5τ → ~100 %');
add('cap','Two capacitors, one with 2 µF and one with 4 µF capacity are connected in parallel. What is the total capacity?',['less than 2 µF','between 2 µF and 4 µF','more than 4 µF'],2,
 ['C ขนาน = บวกกันตรง ๆ 2 + 4 = 6 µF (มากกว่า 4 µF)','C ขนานบวก (พื้นที่เพลตรวม) • C อนุกรมแบบ "กลับหัว"'],
 ['Parallel capacitances simply add: 2 + 4 = 6 µF (more than 4 µF).','C parallel adds (more plate area); C series is the reciprocal form.'],'C_T = C1 + C2 = 6 µF');
add('cap','What describes the construction of a capacitor?',['The capacitor consists out of 2 metal plates separated by a dielectric.','The capacitor consists out of a coil wound on an iron core.','The capacitor consists out of a resistive wire.'],0,
 ['ตัวเก็บประจุ = แผ่นโลหะ 2 แผ่น คั่นด้วยฉนวน (dielectric)','Capacitor = 2 plates + dielectric (แซนด์วิช)'],
 ['A capacitor is two metal plates separated by an insulator (dielectric).','Capacitor = plate / dielectric / plate sandwich.']);

/* --- magnetism & inductors --- */
add('mag','Which rule can we use to detect the direction of the magnetic field around a wire?',['Lenz\'s rule','(Cork)-screw rule','Coulomb\'s rule'],1,
 ['ทิศสนามแม่เหล็กรอบเส้นลวดหาจาก corkscrew rule: ทิศกระแส = ทิศเดินหน้าของสกรู ทิศหมุน = ทิศสนาม','Corkscrew: หมุนสกรู = สนาม, เดินหน้า = กระแส'],
 ['The field direction around a wire follows the (cork)screw rule: current is the screw\'s forward motion, field is its rotation.','Screw forward = current, screw turn = field.']);
add('mag','What is the concentrating effect of magnetic flux called?',['Reluctance','Permeability','Retentivity'],1,
 ['Permeability (μ) คือความสามารถของวัสดุในการรวมเส้นแรงแม่เหล็ก (เหล็กสูง อากาศต่ำ) Reluctance คือการต้านเส้นแรง','Permeability = "ผ่านได้ง่าย/รวมฟลักซ์" • Reluctance = ต้านฟลักซ์'],
 ['Permeability (μ) is how well a material concentrates magnetic flux (high for iron). Reluctance is the opposition.','Permeability = concentrates flux; reluctance = resists it.']);
add('mag','What is the unit of the magnetic field strength?',['T (Tesla)','Wb (Weber)','A/m'],2,
 ['Field strength H มีหน่วยแอมแปร์ต่อเมตร (A/m) ส่วน Tesla = flux density (B), Weber = flux (Φ)','H → A/m • B → Tesla • Φ → Weber'],
 ['Magnetic field strength H is in amperes per metre (A/m). Tesla is flux density B; weber is flux Φ.','H → A/m, B → tesla, Φ → weber.']);
add('mag','Which material is a ferromagnetic material?',['Copper','Aluminium','Iron'],2,
 ['Ferromagnetic = ถูกแม่เหล็กดูดแรง: เหล็ก นิกเกิล โคบอลต์ (ทองแดงและอะลูมิเนียมไม่ใช่)','Ferro = เหล็ก (Fe) • จำ Fe-Ni-Co'],
 ['Ferromagnetic materials are strongly attracted by magnets: iron, nickel, cobalt (not copper or aluminium).','Ferro = iron. Remember Fe-Ni-Co.']);
add('mag','A parallel connection of two coils, one with 30 mH (millihenry) and one with 60 mH is given. What is the total inductance in the circuit?',['less than 30 mH','between 30 mH and 60 mH','more than 60 mH'],0,
 ['L ขนานคิดเหมือน R ขนาน: (30×60)/(30+60) = 20 mH น้อยกว่า 30 mH','L ขนาน = เหมือน R ขนาน → น้อยกว่าตัวเล็กสุด'],
 ['Parallel inductances combine like parallel resistors: (30×60)/(30+60) = 20 mH, below 30 mH.','L parallel = like R parallel: below the smallest.'],'L_T = (L1·L2)/(L1+L2) = 20 mH');
add('mag','A series connection of two coils, one with 30 mH (millihenry) and one with 60 mH is given. What is the total inductance in the circuit?',['less than 30 mH','between 30 mH and 60 mH','more than 60 mH'],2,

function begin(ids){
  let l=S.shuffle?shuf(ids):ids.slice();
  if(S.n&&l.length>S.n&&ids!==undefined)l=l.slice(0,S.n);
  if(!l.length)return;
  S.list=l;S.i=0;S.ans={};S.perm={};l.forEach(i=>S.perm[i]=S.shuffle?shuf([0,1,2]):[0,1,2]);S.view='drill';S.filter='all';render();window.scrollTo({top:0});
}

function optHTML(id,pos,reveal){
  const q=Q[id],oi=S.perm[id][pos],c=S.ans[id];let cls='opt';
  if(reveal){if(oi===q.a)cls+=' right';else if(c===oi)cls+=' wrong'}else if(c===oi)cls+=' sel';
  return `<button class="${cls}" data-o="${oi}" ${reveal?'disabled':''}><span class="k">${'ABC'[pos]}</span><span class="t">${esc(q.o[oi])}</span></button>`;
}
function expHTML(id){
  const q=Q[id],c=S.ans[id],ok=c===q.a,x=q[S.lang];
  const letter='ABC'[S.perm[id].indexOf(q.a)];
  const th=q.th,en=q.en;const e=S.lang==='th'?th:en;
  return `<div class="exp">
   <div class="verdict ${c===undefined?'bad':ok?'ok':'bad'}">${esc(c===undefined?tr('unans'):ok?tr('correct'):tr('wrong'))} · ${esc(tr('ans'))} ${letter}</div>
   <p>${esc(e[0])}</p>
   ${q.f?`<div class="formula">${esc(q.f)}</div>`:''}
   ${q.w?`<div class="warnbox">${esc(q.w)}</div>`:''}
   <div class="trick"><b>${esc(tr('trick'))}:</b> ${esc(e[1])}</div></div>`;
}
function qCard(id,num,total,reveal){
  const q=Q[id];

   <div class="qhead"><span class="qnum">${esc(tr('q'))} ${num} / ${total}</span><span class="row" style="gap:6px"><span class="tag">${esc(tl(q.t))}</span>${q.w?'<span class="tag warn">!</span>':''}</span></div>

   ${q.fig?`<div class="diagram"><img src="${FIG[q.fig]}" alt="figure"></div>`:''}
   <div class="opts">${[0,1,2].map(p=>optHTML(id,p,reveal)).join('')}</div>
   ${reveal?expHTML(id):''}</article>`;
}

  const right=S.list.filter(i=>S.ans[i]===Q[i].a).length;
  app.innerHTML=`
  <div class="bar"><button id="quit">${esc(tr('quit'))}</button><div class="prog"><i style="width:${done/n*100}%"></i></div>
   <span class="count">${done}/${n} ${esc(tr('answered'))}${S.mode==='instant'?` · ${right} ✓`:''}</span>${toolsHTML()}</div>
  ${qCard(id,S.i+1,n,reveal)}
  <div class="row spread"><button id="prev" ${S.i===0?'disabled':''}>← ${esc(tr('prev'))}</button>
   ${last?`<button class="primary" id="fin" ${S.mode==='instant'&&!reveal?'disabled':''}>${esc(S.mode==='instant'?tr('finish'):tr('submit'))}</button>`
         :`<button class="primary" id="nxt" ${S.mode==='instant'&&!reveal?'disabled':''}>${esc(tr('next'))} →</button>`}</div>`;
  wireTools();
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.o));
  $('#quit').onclick=()=>{S.view='home';render()};
  $('#prev').onclick=()=>{S.i--;render();window.scrollTo({top:0})};
  if($('#nxt'))$('#nxt').onclick=()=>{S.i++;render();window.scrollTo({top:0})};
  if($('#fin'))$('#fin').onclick=finish;
}
function pick(oi){
  const id=S.list[S.i];if(S.mode==='instant'&&S.ans[id]!==undefined)return;
  S.ans[id]=oi;
  if(S.mode==='instant')track(id);
  render();
}
function track(id){if(S.ans[id]===Q[id].a)S.wrong.delete(id);else S.wrong.add(id);store.set('m3p_wrong',[...S.wrong])}
function finish(){
  if(S.mode==='review')S.list.forEach(id=>{if(S.ans[id]!==undefined)track(id);else S.wrong.add(id)});store.set('m3p_wrong',[...S.wrong]);
  S.view='result';render();window.scrollTo({top:0});
}

/* ================= result ================= */
function renderResult(){
  const n=S.list.length,ok=S.list.filter(i=>S.ans[i]===Q[i].a).length,p=Math.round(ok/n*100);
  const by={};S.list.forEach(i=>{const t=Q[i].t;by[t]=by[t]||{c:0,n:0};by[t].n++;if(S.ans[i]===Q[i].a)by[t].c++});
  const wr=S.list.filter(i=>S.ans[i]!==Q[i].a);
  const show=S.filter==='wrong'?wr:S.list;
  app.innerHTML=`
  <header class="row spread"><div><div class="eyebrow">${esc(tr('sub'))}</div><h1>${esc(tr('result'))}</h1></div>${toolsHTML()}</header>
  <section class="card" style="display:flex;flex-direction:column;gap:14px">
   <div class="score"><span class="big">${p}%</span><span class="muted">${esc(tr('score'))} ${ok}/${n}</span></div>
   <div><div class="eyebrow">${esc(tr('byTopic'))}</div><div class="topics">${Object.entries(by).map(([t,v])=>`<div class="trow"><span>${esc(tl(t))}</span><span class="tbar"><i style="width:${v.c/v.n*100}%;${v.c/v.n<.75?'background:var(--bad)':''}"></i></span><span class="n">${v.c}/${v.n}</span></div>`).join('')}</div></div>
   <div class="row">${wr.length?`<button class="primary" id="rw">${esc(tr('retryW'))} (${wr.length})</button>`:''}<button id="ag">${esc(tr('again'))}</button><button id="hm">${esc(tr('home'))}</button></div>
  </section>
  <div class="row spread"><h2>${esc(tr('review'))}</h2><div class="row" style="gap:6px"><button id="fa" class="${S.filter==='all'?'primary':''}">${esc(tr('allR'))}</button><button id="fw" class="${S.filter==='wrong'?'primary':''}">${esc(tr('wrongR'))}</button></div></div>
  <div class="review">${show.length?show.map(i=>qCard(i,S.list.indexOf(i)+1,n,true)).join(''):`<div class="card">${esc(tr('perfect'))}</div>`}</div>`;
  wireTools();
  if($('#rw'))$('#rw').onclick=()=>begin(wr);
  $('#ag').onclick=()=>{S.view='home';render()};$('#hm').onclick=()=>{S.view='home';render()};
  $('#fa').onclick=()=>{S.filter='all';renderResult()};$('#fw').onclick=()=>{S.filter='wrong';renderResult()};
}

function render(){document.documentElement.lang=S.lang;if(S.view==='home')renderHome();else if(S.view==='drill')renderDrill();else renderResult()}
document.addEventListener('keydown',e=>{
  if(S.view!=='drill'||e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;
  const k=e.key.toLowerCase();
  if(['a','b','c','1','2','3'].includes(k))pick(S.perm[S.list[S.i]][{a:0,b:1,c:2,1:0,2:1,3:2}[k]]);
  else if(e.key==='ArrowRight'||e.key==='Enter'){const b=$('#nxt')||$('#fin');if(b&&!b.disabled)b.click()}
  else if(e.key==='ArrowLeft'){const b=$('#prev');if(b&&!b.disabled)b.click()}
});
applyTheme();render();
</script>
